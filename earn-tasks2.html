.name{

}

.description{

line-height:1.6;
margin-top:13px;
overflow-wrap:anywhere;

.task-details{

color:#d7e0ed;
background:var(--panel2);
border:1px solid #2a3b51;
border-radius:7px;

.status{

margin-top:13px;
padding:7px 10px;
border-radius:8px;
background:#17372e;
border:1px solid #245847;
color:#9be6c3;
font-size:11px;
font-weight:bold;
}

.view{
display:block;
margin-top:15px;
padding:13px;
background:var(--gold);
color:#111827;
border-radius:11px;
text-align:center;
text-decoration:none;
font-weight:800;
font-size:14px;
border:0;
width:100%;
cursor:pointer;
}

.view:active{
transform:scale(.98);
}

.view:disabled{
opacity:.65;
cursor:wait;
transform:none;
}

.message{
padding:35px 18px;
text-align:center;
color:var(--muted);
line-height:1.7;
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
font-size:13px;
}

.error{
padding:16px;
background:#291d27;
color:#ffd5df;
border:1px solid #643345;
border-radius:12px;
font-size:13px;
line-height:1.6;
overflow-wrap:anywhere;
}

/* ADVERTISEMENT - PRESERVED */

.ad{
margin-top:25px;
border:1px dashed #34445a;
border-radius:14px;
padding:15px;
text-align:center;
color:var(--muted);
font-size:12px;
overflow:hidden;
background:#0d1929;
}

.ad-label{
font-size:10px;
letter-spacing:1px;
color:#7f8da2;
margin-bottom:12px;
}

/* BOTTOM NAVIGATION */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
width:100%;
min-height:72px;
display:flex;
align-items:center;
justify-content:space-around;
padding:7px 3px calc(7px + env(safe-area-inset-bottom));
background:#0c1727;
border-top:1px solid #26364b;
box-shadow:0 -4px 18px rgba(0,0,0,.25);
z-index:9999;
}

.bottom-nav a{
flex:1;
min-width:0;
min-height:50px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#94a3b8;
text-decoration:none;
font-size:10px;
font-weight:600;
white-space:nowrap;
}

.bottom-nav a svg{
width:22px;
height:22px;
stroke:currentColor;
stroke-width:1.8;
fill:none;
stroke-linecap:round;

}

.bottom-nav a.active{
color:var(--gold);
font-weight:800;
}

.bottom-nav a.earn-link{

.bottom-nav a.earn-link .earn-icon-wrap{
width:46px;

background:#263044;

.bottom-nav a.earn-link svg{

.bottom-nav a.earn-link span{

@media(max-width:380px){

gap:3px;

.bottom-nav a.earn-link .earn-icon-wrap{
width:42px;
height:42px;
margin-top:-16px;
}
}
</style>

<script>
const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const SMART_LINKS = [
"https://www.profitableratecpmnetwork.com/c6m8pem7u?key=90e7773038438e1e506bfc33084dbc50",
"https://omg10.com/4/11655687",
"https://omg10.com/4/11655690"
];

/*
Remember opened ads for this browser tab session.
The record remains after navigating away and returning.
*/
const openedCampaigns = new Set();

function hasOpenedSmartLink(campaignId){
try{
return sessionStorage.getItem(
"earninghub_smartlink_opened_" + String(campaignId)
) === "yes";
}catch(error){
return openedCampaigns.has(String(campaignId));
}
}

function markSmartLinkOpened(campaignId){
const id = String(campaignId);

openedCampaigns.add(id);

try{
sessionStorage.setItem(
"earninghub_smartlink_opened_" + id,
"yes"
);
}catch(error){
/* Keep the in-memory fallback if storage is unavailable. */
}
}

function escapeHTML(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatPlatform(value){
const names = {
youtube:"YouTube",
facebook:"Facebook",
instagram:"Instagram",
tiktok:"TikTok",
website:"Website"
};

const key = String(value || "").toLowerCase().trim();

return names[key] || String(value || "Campaign");
}

function formatTaskType(value){
const names = {
youtube_subscribe:"YouTube Subscribe",
video_watch:"Watch Video",
content_discovery:"Discover Content",
feedback:"Provide Feedback",
website_visit:"Website Visit",
survey:"Complete Survey",
facebook_follow:"Facebook Follow",
instagram_follow:"Instagram Follow",
tiktok_follow:"TikTok Follow"
};

const key = String(value || "").toLowerCase().trim();

return names[key] || String(value || "Campaign Task")
.replace(/_/g," ")
.replace(/\b\w/g, c => c.toUpperCase());
}

function openSmartLink(campaignId, button){
const id = String(campaignId || "");

if(!id){
return;
}

/*
If the SmartLink has already opened for this campaign,
do not open another ad. Go straight to the task.
*/
if(hasOpenedSmartLink(id)){
window.location.href =
"task.html?campaign=" + encodeURIComponent(id);
return;
}

/* Prevent repeated taps while this click is being handled. */
if(openedCampaigns.has(id)){
return;
}

openedCampaigns.add(id);

if(button){
button.disabled = true;
button.textContent = "Opening Task...";
}

const randomIndex = Math.floor(
Math.random() * SMART_LINKS.length
);

const smartLink = SMART_LINKS[randomIndex];

/*
Open the SmartLink from the user's click.
If it opens successfully, remember it before navigating
to the task page.
*/
const adWindow = window.open(smartLink, "_blank");

if(!adWindow){
openedCampaigns.delete(id);

if(button){
button.disabled = false;
button.textContent = "View Task →";
}

alert(
"Your browser blocked the ad popup. Please allow pop-ups and try again."
);

return;
}

/* Save the opened status so returning won't show the ad again. */
markSmartLinkOpened(id);

/* Continue to the selected campaign task. */
window.location.href =
"task.html?campaign=" + encodeURIComponent(id);
}

async function loadCampaigns(){
const box = document.getElementById("tasks");
const count = document.getElementById("task-count");

const {data, error} = await client
.from("campaigns")
.select("id,title,description,platform,task_type,target_url,reward,budget,status,created_at")
.eq("status","active")
.order("created_at",{ascending:false});

if(error){
count.textContent = "Unavailable";

box.innerHTML = `
<div class="error">
<b>Could not load campaigns.</b>
<br><br>
${escapeHTML(error.message)}
<br><br>
Please check the Supabase campaigns table and its access policies.
</div>
`;
return;
}

if(!data || data.length === 0){
count.textContent = "0 tasks";

box.innerHTML = `
<div class="message">
<div style="font-size:30px;margin-bottom:12px;">📋</div>
<b>No active campaigns available right now.</b>
<br><br>
Campaigns will appear here when they have been approved and activated.
</div>
`;
return;
}

count.textContent =
data.length + (data.length === 1 ? " task" : " tasks");

box.innerHTML = data.map(c => {
const platform = formatPlatform(c.platform);
const taskType = formatTaskType(c.task_type);
const reward = Number(c.reward || 0);
const campaignId = escapeHTML(c.id);

return `
<article class="card">

<div class="card-top">
<div style="min-width:0;">
<div class="platform">${escapeHTML(platform)}</div>
<div class="name">${escapeHTML(c.title)}</div>
</div>

<div class="reward">
$${Number.isFinite(reward) ? reward.toFixed(2) : "0.00"}
</div>
</div>

<div class="description">
${escapeHTML(c.description || "Complete this campaign's requested activity and follow the campaign instructions.")}
</div>

<div class="task-details">
<span class="tag">${escapeHTML(taskType)}</span>
<span class="tag">${escapeHTML(platform)}</span>
</div>

<div class="status">● Active Campaign</div>

<button
class="view"
type="button"
data-campaign-id="${campaignId}">
View Task →
</button>

</article>
`;
}).join("");

box.querySelectorAll("[data-campaign-id]").forEach(button => {
button.addEventListener("click", function(){
openSmartLink(this.dataset.campaignId, this);
});
});
}

loadCampaigns();
</script>
