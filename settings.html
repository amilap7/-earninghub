<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>EarningHub Settings</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:700px;
min-height:100vh;
margin:auto;
padding:0 20px 30px
}


/* APP BAR */

header{
height:90px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:3px solid #111;
background:#fff
}

.back-button{
width:40px;
height:40px;
border:0;
background:#fff;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.back-button:active{
background:#f3f3f3
}

.back-button svg{
width:23px;
height:23px;
stroke:#111;
stroke-width:2;
fill:none;
stroke-linecap:round;
stroke-linejoin:round
}

.logo{
width:105px;
height:auto;
display:block;
object-fit:contain
}

.header-space{
width:40px
}


/* MAIN */

.main{
padding-top:25px
}

.page-title{
margin-bottom:25px
}

.page-title small{
color:#777;
font-size:13px
}

.page-title h1{
font-size:28px;
margin-top:6px
}


/* SETTINGS */

.settings{
display:flex;
flex-direction:column;
gap:12px
}

.setting-card{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
background:#fff
}

.setting-card h2{
font-size:16px;
margin-bottom:6px
}

.setting-card p{
font-size:13px;
color:#777;
line-height:1.5
}


/* SETTING BUTTON */

.setting-button{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
border:0;
background:#fff;
color:#111;
padding:0;
text-align:left;
cursor:pointer
}

.setting-left{
display:flex;
align-items:center;
gap:13px
}

.setting-icon{
width:40px;
height:40px;
border-radius:10px;
background:#f3f3f3;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex-shrink:0
}

.setting-arrow{
font-size:20px;
color:#777
}


/* INFO */

.info{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
margin-top:20px
}

.info strong{
font-size:15px
}

.info p{
font-size:13px;
color:#777;
line-height:1.5;
margin-top:7px
}


/* FOOTER */

footer{
text-align:center;
padding:35px 0 20px;
color:#888;
font-size:12px
}


/* MOBILE */

@media(max-width:600px){

.app{
max-width:480px;
padding:0 20px 20px
}

header{
height:90px
}

.logo{
width:105px
}

.page-title h1{
font-size:26px
}

}

</style>

</head>


<body>

<div class="app">


<!-- APP BAR -->

<header>


<button
class="back-button"
type="button"
onclick="goDashboard()"
aria-label="Back"
>

<svg viewBox="0 0 24 24">

<line
x1="19"
y1="12"
x2="5"
y2="12">
</line>

<polyline
points="12 19 5 12 12 5">
</polyline>

</svg>

</button>


<img
class="logo"
src="./logo.PNG"
alt="EarningHub Logo"
>


<div class="header-space"></div>


</header>


<!-- MAIN -->

<div class="main">


<div class="page-title">

<small>
EarningHub
</small>

<h1>
Settings
</h1>

</div>


<!-- SETTINGS -->

<div class="settings">


<!-- ACCOUNT -->

<div class="setting-card">

<button
class="setting-button"
type="button"
onclick="openAccount()"
>

<div class="setting-left">

<div class="setting-icon">
👤
</div>

<div>

<h2>
Account
</h2>

<p>
View and manage your account information.
</p>

</div>

</div>

<div class="setting-arrow">
›
</div>

</button>

</div>


<!-- NOTIFICATIONS -->

<div class="setting-card">

<button
class="setting-button"
type="button"
onclick="showMessage('Notification settings will be available soon.')"
>

<div class="setting-left">

<div class="setting-icon">
🔔
</div>

<div>

<h2>
Notifications
</h2>

<p>
Manage your EarningHub notifications.
</p>

</div>

</div>

<div class="setting-arrow">
›
</div>

</button>

</div>


<!-- SECURITY -->

<div class="setting-card">

<button
class="setting-button"
type="button"
onclick="showMessage('Security settings will be available soon.')"
>

<div class="setting-left">

<div class="setting-icon">
🔐
</div>

<div>

<h2>
Security
</h2>

<p>
Manage your account security settings.
</p>

</div>

</div>

<div class="setting-arrow">
›
</div>

</button>

</div>


<!-- PRIVACY -->

<div class="setting-card">

<button
class="setting-button"
type="button"
onclick="showMessage('Privacy settings will be available soon.')"
>

<div class="setting-left">

<div class="setting-icon">
🛡️
</div>

<div>

<h2>
Privacy
</h2>

<p>
Manage your privacy preferences.
</p>

</div>

</div>

<div class="setting-arrow">
›
</div>

</button>

</div>


<!-- ABOUT -->

<div class="setting-card">

<button
class="setting-button"
type="button"
onclick="showMessage('EarningHub 2026')"
>

<div class="setting-left">

<div class="setting-icon">
ℹ️
</div>

<div>

<h2>
About EarningHub
</h2>

<p>
Information about EarningHub.
</p>

</div>

</div>

<div class="setting-arrow">
›
</div>

</button>

</div>


</div>


<!-- INFO -->

<div class="info">

<strong>
EarningHub Settings
</strong>

<p>
Manage your account preferences and EarningHub settings from this page.
</p>

</div>


<footer>

© 2026 EarningHub

</footer>


</div>

</div>


<script>


/*
GO TO DASHBOARD
*/

function goDashboard(){

window.location.href =
"dashboard.html";

}


/*
ACCOUNT
*/

function openAccount(){

window.location.href =
"account.html";

}


/*
MESSAGE
*/

function showMessage(message){

alert(message);

}

</script>


</body>

</html>
