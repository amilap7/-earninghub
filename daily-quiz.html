<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Daily Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#0b1220;
color:#f1f5f9;
font-weight:600;
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:900;
color:#ffd54a;
}

.logo::before{
content:"●";
color:#ffd54a;
font-size:10px;
margin-right:7px;
vertical-align:middle;
}

.back{
border:1px solid #344b70;
background:#172640;
border-radius:10px;
padding:10px 14px;
font-weight:800;
text-decoration:none;
color:#fff
}

h1{
font-size:30px;
font-weight:900;
color:#fff;
margin-bottom:8px
}

.subtitle{
color:#a9bad4;
font-size:14px;
margin-bottom:18px;
line-height:1.5
}

.quiz-progress{
border:1px solid #263957;
border-radius:16px;
padding:15px;
margin-bottom:18px;
background:#111c30;
}

.progress-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
font-size:14px
}

.progress-title{
font-weight:800;
color:#fff;
}

#quizProgressText{
font-size:16px;
font-weight:900;
color:#ffd54a;
}

.progress-track{
width:100%;
height:9px;
background:#263957;
border-radius:999px;
overflow:hidden
}

.progress-fill{
height:100%;
width:0%;
background:#ffd54a;
border-radius:999px;
transition:width .35s ease
}

.quiz-card{
border:1px solid #263957;
border-radius:20px;
padding:20px;
margin-bottom:18px;
background:#111c30;
}

.quiz-label{
font-size:12px;
font-weight:900;
color:#ffd54a;
text-transform:uppercase;
letter-spacing:.5px;
margin-bottom:12px
}

.quiz-label::before{
content:"●";
color:#ffd54a;
font-size:9px;
margin-right:7px;
}

.question{
font-size:20px;
font-weight:800;
color:#fff;
line-height:1.5;
margin-bottom:20px
}

.option{
display:flex;
align-items:center;
width:100%;
border:1px solid #304666;
border-radius:13px;
padding:14px;
margin-bottom:10px;
background:#172640;
color:#f1f5f9;
cursor:pointer;
transition:.15s;
}

.option:hover{
border-color:#ffd54a;
}

.option:has(input:checked){
border-color:#ffd54a;
background:#1c2d48;
}

.option input{
margin-right:12px;
width:18px;
height:18px;
accent-color:#ffd54a;
flex-shrink:0;
}

.option-text{
font-size:14px;
font-weight:700;
line-height:1.5;
overflow-wrap:anywhere;
}

.submit{
width:100%;
border:0;
background:#ffd54a;
color:#111827;
padding:15px;
border-radius:12px;
font-weight:900;
font-size:15px;
cursor:pointer;
margin-top:8px;
}

.submit:disabled{
opacity:.5;
cursor:not-allowed
}

.message{
display:none;
padding:15px;
border-radius:13px;
font-size:14px;
line-height:1.6;
margin-bottom:18px;
overflow-wrap:anywhere;
}

.message.success{
display:block;
background:#12372c;
border:1px solid #24634b;
color:#b9f6d5;
}

.message.error{
display:block;
background:#3b2029;
border:1px solid #713847;
color:#ffd1d9;
}

.message.info{
display:block;
background:#172640;
border:1px solid #344b70;
color:#e2eaff;
}

.reward{
display:none;
border:1px solid #344b70;
border-radius:18px;
padding:20px;
text-align:center;
margin-bottom:18px;
background:#111c30;
}

.reward-icon{
font-size:38px;
margin-bottom:8px
}

.reward h2{
font-size:22px;
font-weight:900;
color:#ffd54a;
margin-bottom:7px
}

.reward p{
font-size:14px;
color:#a9bad4;
line-height:1.6;
}

.loading{
text-align:center;
padding:30px 10px;
color:#a9bad4;
font-size:14px
}

.empty{
border:1px solid #263957;
border-radius:18px;
padding:25px;
text-align:center;
color:#a9bad4;
font-size:14px;
line-height:1.6;
background:#111c30;
}

.info-card{
border:1px solid #263957;
border-radius:18px;
padding:18px;
margin-top:18px;
background:#111c30;
}

.info-card h3{
font-size:16px;
font-weight:900;
color:#fff;
margin-bottom:8px
}

.info-card p{
font-size:13px;
color:#a9bad4;
line-height:1.6
}

footer{
text-align:center;
padding:35px 0 20px;
color:#8395b3;
font-size:12px
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">EarningHub</div>

<a class="back" href="dashboard2.html">Back</a>
</header>

<h1>Daily Quiz</h1>

<p class="subtitle">
Answer today's question and earn reward points.
</p>

<div class="quiz-progress">

<div class="progress-header">
<span class="progress-title">Today's Progress</span>

<strong id="quizProgressText">0/10</strong>
</div>

<div class="progress-track">
<div id="quizProgressBar" class="progress-fill"></div>
</div>

</div>

<div id="message" class="message"></div>

<div id="loading" class="loading">
Loading today's quiz...
</div>

<div id="quizContainer" style="display:none">

<div class="quiz-card">

<div class="quiz-label">Today's Quiz</div>

<div id="question" class="question"></div>

<div id="options">

<label class="option">
<input type="radio" name="quizOption" value="A">
<span id="optionA" class="option-text"></span>
</label>

<label class="option">
<input type="radio" name="quizOption" value="B">
<span id="optionB" class="option-text"></span>
</label>

<label class="option">
<input type="radio" name="quizOption" value="C">
<span id="optionC" class="option-text"></span>
</label>

<label class="option">
<input type="radio" name="quizOption" value="D">
<span id="optionD" class="option-text"></span>
</label>

</div>

<button id="submitButton" class="submit" onclick="submitQuiz()">
Submit Answer
</button>

</div>
</div>

<div id="reward" class="reward">

<div class="reward-icon">🎉</div>

<h2 id="rewardTitle">Reward Earned!</h2>

<p id="rewardText"></p>

</div>

<div class="info-card">

<h3>How it works</h3>

<p>
Answer today's quiz correctly to earn reward points.
You can attempt each daily quiz only once.
</p>

</div>

<footer>
© 2026 EarningHub
</footer>

</div>

<script>
const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentQuiz = null;
let currentUser = null;
let todaysQuizzes = [];
let attemptedQuizIds = [];

/* MESSAGE */

function showMessage(text,type){
const message = document.getElementById("message");
message.textContent = text;
message.className = "message " + type;
message.style.display = "block";
}

function hideMessage(){
const message = document.getElementById("message");
message.textContent = "";
message.className = "message";
message.style.display = "none";
}

/* TODAY */

function getToday(){
const now = new Date();

const year = now.getFullYear();

const month = String(
now.getMonth()+1
).padStart(2,"0");

const day = String(
now.getDate()
).padStart(2,"0");

return `${year}-${month}-${day}`;
}

/* QUIZ PROGRESS */

function updateQuizProgress(){
const progressText = document.getElementById("quizProgressText");
const progressBar = document.getElementById("quizProgressBar");

const completedCount = todaysQuizzes.filter(function(quiz){
return attemptedQuizIds.includes(quiz.id);
}).length;

const safeCount = Math.min(completedCount,10);

progressText.textContent = safeCount + "/10";
progressBar.style.width = ((safeCount/10)*100) + "%";
}

/* LOGIN CHECK */

async function checkLogin(){
const {data,error} = await client.auth.getSession();

if(error){
showMessage("Session error: " + error.message,"error");
return false;
}

if(!data.session){
showMessage("Please login first.","info");

setTimeout(function(){
window.location.href = "index.html";
},1200);

return false;
}

currentUser = data.session.user;
return true;
}

/* LOAD QUIZZES */

async function loadQuizzes(){
const loading = document.getElementById("loading");
const quizContainer = document.getElementById("quizContainer");

const today = getToday();

const {data,error} = await client
.from("daily_quizzes")
.select("id,question,option_a,option_b,option_c,option_d,reward_points,quiz_date,quiz_number")
.eq("is_active",true)
.eq("quiz_date",today)
.order("quiz_number",{ascending:true});

if(error){
loading.style.display = "none";

showMessage(
"Unable to load today's quizzes: " + error.message,
"error"
);

return false;
}

todaysQuizzes = data || [];

const oldEmpty = document.querySelector(".empty");
if(oldEmpty){
oldEmpty.remove();
}

if(!todaysQuizzes.length){
attemptedQuizIds = [];
updateQuizProgress();

loading.style.display = "none";
quizContainer.style.display = "none";

const empty = document.createElement("div");
empty.className = "empty";
empty.textContent =
"Today's quizzes are not available yet. Please check again later.";

loading.parentNode.insertBefore(empty,loading.nextSibling);
return false;
}

/* LOAD USER ATTEMPTS */

const quizIds = todaysQuizzes.map(function(quiz){
return quiz.id;
});

const {data:attempts,error:attemptError} = await client
.from("quiz_attempts")
.select("quiz_id,is_correct")
.eq("user_id",currentUser.id)
.in("quiz_id",quizIds);

if(attemptError){
console.error("Attempt load error:",attemptError);

loading.style.display = "none";

showMessage(
"Unable to check quiz attempts: " + attemptError.message,
"error"
);

return false;
}

attemptedQuizIds = (attempts || []).map(function(attempt){
return attempt.quiz_id;
});

updateQuizProgress();

/* FIND NEXT QUIZ */

const nextQuiz = todaysQuizzes.find(function(quiz){
return !attemptedQuizIds.includes(quiz.id);
});

loading.style.display = "none";

if(!nextQuiz){
quizContainer.style.display = "none";

if(
todaysQuizzes.length >= 10 &&
attemptedQuizIds.length >= 10
){
showMessage(
"🎉 You have completed all 10 quizzes for today. Come back tomorrow for 10 new quizzes.",
"success"
);
}else{
showMessage(
"Today's quizzes are completed. More quizzes will be available soon.",
"info"
);
}

return false;
}

/* DISPLAY NEXT QUIZ */

currentQuiz = nextQuiz;

document.getElementById("question").textContent = nextQuiz.question;
document.getElementById("optionA").textContent = nextQuiz.option_a;
document.getElementById("optionB").textContent = nextQuiz.option_b;
document.getElementById("optionC").textContent = nextQuiz.option_c;
document.getElementById("optionD").textContent = nextQuiz.option_d;

document.querySelectorAll('input[name="quizOption"]').forEach(function(input){
input.checked = false;
input.disabled = false;
});

const submitButton = document.getElementById("submitButton");

submitButton.disabled = false;
submitButton.textContent = "Submit Answer";

quizContainer.style.display = "block";

return true;
}

/* SUBMIT QUIZ */

async function submitQuiz(){
if(!currentUser){
showMessage("Please login first.","info");
return;
}

if(!currentQuiz){
showMessage("Quiz is not available.","error");
return;
}

const selected = document.querySelector(
'input[name="quizOption"]:checked'
);

if(!selected){
showMessage("Please select an answer.","error");
return;
}

const submitButton = document.getElementById("submitButton");

submitButton.disabled = true;
submitButton.textContent = "Submitting...";

hideMessage();

const {data,error} = await client.rpc(
"submit_daily_quiz",
{
p_quiz_id: currentQuiz.id,
p_selected_option: selected.value
}
);

if(error){
submitButton.disabled = false;
submitButton.textContent = "Submit Answer";

showMessage(
"Unable to submit quiz: " + error.message,
"error"
);

return;
}

if(!data || !data.success){
submitButton.disabled = false;
submitButton.textContent = "Submit Answer";

showMessage(
data && data.message ? data.message : "Unable to submit quiz.",
"error"
);

return;
}

document.querySelectorAll('input[name="quizOption"]').forEach(function(input){
input.disabled = true;
});

if(!attemptedQuizIds.includes(currentQuiz.id)){
attemptedQuizIds.push(currentQuiz.id);
}

updateQuizProgress();

if(data.correct){
showMessage(data.message,"success");

const reward = document.getElementById("reward");
const rewardText = document.getElementById("rewardText");

const rewardAmount = Number(data.reward_amount || 0).toFixed(2);

rewardText.textContent =
data.reward_points +
" points earned • $" +
rewardAmount +
" added to your wallet.";

reward.style.display = "block";
}else{
showMessage(data.message,"info");
}

submitButton.textContent = "Quiz Completed";

setTimeout(async function(){
document.getElementById("reward").style.display = "none";
await loadQuizzes();
},1500);
}

/* INIT */

async function init(){
const loggedIn = await checkLogin();

if(!loggedIn){
return;
}

await loadQuizzes();
}

init();
</script>

</body>
</html>
