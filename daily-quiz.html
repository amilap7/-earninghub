<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Daily Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
text-decoration:none;
color:#111
}

h1{
font-size:30px;
margin-bottom:8px
}

.subtitle{
color:#777;
font-size:14px;
margin-bottom:22px
}

.quiz-card{
border:1px solid #ddd;
border-radius:20px;
padding:20px;
margin-bottom:18px
}

.quiz-label{
font-size:12px;
font-weight:bold;
color:#777;
text-transform:uppercase;
letter-spacing:.5px;
margin-bottom:12px
}

.question{
font-size:20px;
font-weight:bold;
line-height:1.4;
margin-bottom:20px
}

.option{
display:flex;
align-items:center;
width:100%;
border:1px solid #ddd;
border-radius:13px;
padding:14px;
margin-bottom:10px;
background:#fff;
cursor:pointer;
transition:.15s
}

.option:hover{
border-color:#111
}

.option input{
margin-right:12px;
width:18px;
height:18px;
accent-color:#111
}

.option-text{
font-size:14px;
line-height:1.4
}

.submit{
width:100%;
border:0;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:8px
}

.submit:disabled{
opacity:.5;
cursor:not-allowed
}

.message{
display:none;
padding:15px;
border-radius:13px;
font-size:14px;
line-height:1.5;
margin-bottom:18px
}

.message.success{
display:block;
background:#eef9f0;
border:1px solid #cde8d1
}

.message.error{
display:block;
background:#fff1f1;
border:1px solid #efcccc
}

.message.info{
display:block;
background:#f3f3f3;
border:1px solid #ddd
}

.reward{
display:none;
border:1px solid #ddd;
border-radius:18px;
padding:20px;
text-align:center;
margin-bottom:18px
}

.reward-icon{
font-size:38px;
margin-bottom:8px
}

.reward h2{
font-size:22px;
margin-bottom:7px
}

.reward p{
font-size:14px;
color:#777
}

.loading{
text-align:center;
padding:30px 10px;
color:#777;
font-size:14px
}

.empty{
border:1px solid #ddd;
border-radius:18px;
padding:25px;
text-align:center;
color:#777;
font-size:14px;
line-height:1.5
}

.info-card{
border:1px solid #ddd;
border-radius:18px;
padding:18px;
margin-top:18px
}

.info-card h3{
font-size:16px;
margin-bottom:8px
}

.info-card p{
font-size:13px;
color:#777;
line-height:1.5
}

footer{
text-align:center;
padding:35px 0 20px;
color:#888;
font-size:12px
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<a
class="back"
href="dashboard2.html">
Back
</a>

</header>

<h1>
Daily Quiz
</h1>

<p class="subtitle">
Answer today's question and earn reward points.
</p>

<div
id="message"
class="message">
</div>

<div
id="loading"
class="loading">
Loading today's quiz...
</div>

<div
id="quizContainer"
style="display:none">

<div class="quiz-card">

<div class="quiz-label">
Today's Quiz
</div>

<div
id="question"
class="question">
</div>

<div id="options">

<label class="option">

<input
type="radio"
name="quizOption"
value="A">

<span
id="optionA"
class="option-text">
</span>

</label>

<label class="option">

<input
type="radio"
name="quizOption"
value="B">

<span
id="optionB"
class="option-text">
</span>

</label>

<label class="option">

<input
type="radio"
name="quizOption"
value="C">

<span
id="optionC"
class="option-text">
</span>

</label>

<label class="option">

<input
type="radio"
name="quizOption"
value="D">

<span
id="optionD"
class="option-text">
</span>

</label>

</div>

<button
id="submitButton"
class="submit"
onclick="submitQuiz()">

Submit Answer

</button>

</div>

</div>

<div
id="reward"
class="reward">

<div class="reward-icon">
🎉
</div>

<h2 id="rewardTitle">
Reward Earned!
</h2>

<p id="rewardText">
</p>

</div>

<div class="info-card">

<h3>
How it works
</h3>

<p>
Answer today's quiz correctly to earn reward points.
You can attempt each daily quiz only once.
</p>

</div>

<footer>
© 2026 EarningHub
</footer>

</div>

<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentQuiz = null;
let currentUser = null;


function showMessage(text,type){

const message =
document.getElementById("message");

message.textContent =
text;

message.className =
"message " + type;

message.style.display =
"block";

}


function hideMessage(){

const message =
document.getElementById("message");

message.textContent =
"";

message.className =
"message";

message.style.display =
"none";

}


async function checkLogin(){

const {
data,
error
} =
await client.auth.getSession();

if(error){

showMessage(
"Session error: " +
error.message,
"error"
);

return false;

}

if(!data.session){

showMessage(
"Please login first.",
"info"
);

setTimeout(function(){

window.location.href =
"index.html";

},1200);

return false;

}

currentUser =
data.session.user;

return true;

}


async function loadQuiz(){

const loading =
document.getElementById("loading");

const quizContainer =
document.getElementById("quizContainer");


const {
data,
error
} =
await client
.from("daily_quizzes")
.select(
"id,question,option_a,option_b,option_c,option_d,reward_points,quiz_date"
)
.eq(
"is_active",
true
)
.eq(
"quiz_date",
new Date().toISOString().split("T")[0]
)
.limit(1)
.maybeSingle();


if(error){

loading.style.display =
"none";

showMessage(
"Unable to load today's quiz: " +
error.message,
"error"
);

return;

}


if(!data){

loading.style.display =
"none";

quizContainer.style.display =
"none";

const empty =
document.createElement("div");

empty.className =
"empty";

empty.textContent =
"Today's quiz is not available yet. Please check again later.";

loading.parentNode.insertBefore(
empty,
loading.nextSibling
);

return;

}


currentQuiz =
data;

document.getElementById(
"question"
).textContent =
data.question;

document.getElementById(
"optionA"
).textContent =
data.option_a;

document.getElementById(
"optionB"
).textContent =
data.option_b;

document.getElementById(
"optionC"
).textContent =
data.option_c;

document.getElementById(
"optionD"
).textContent =
data.option_d;


loading.style.display =
"none";

quizContainer.style.display =
"block";

}


async function checkPreviousAttempt(){

if(!currentUser || !currentQuiz){
return false;
}


const {
data,
error
} =
await client
.from("quiz_attempts")
.select(
"id,is_correct"
)
.eq(
"user_id",
currentUser.id
)
.eq(
"quiz_id",
currentQuiz.id
)
.maybeSingle();


if(error){

console.error(
"Attempt check error:",
error
);

return false;

}


if(data){

const submitButton =
document.getElementById(
"submitButton"
);

submitButton.disabled =
true;

document
.querySelectorAll(
'input[name="quizOption"]'
)
.forEach(function(input){

input.disabled =
true;

});


if(data.is_correct){

showMessage(
"You already completed today's quiz and earned the reward.",
"success"
);

}else{

showMessage(
"You already attempted today's quiz. You cannot attempt it again.",
"info"
);

}

return true;

}

return false;

}


async function submitQuiz(){

if(!currentUser){

showMessage(
"Please login first.",
"info"
);

return;

}

if(!currentQuiz){

showMessage(
"Quiz is not available.",
"error"
);

return;

}


const selected =
document.querySelector(
'input[name="quizOption"]:checked'
);


if(!selected){

showMessage(
"Please select an answer.",
"error"
);

return;

}


const submitButton =
document.getElementById(
"submitButton"
);

submitButton.disabled =
true;

submitButton.textContent =
"Submitting...";

hideMessage();


const {
data,
error
} =
await client.rpc(
"submit_daily_quiz",
{
p_quiz_id:
currentQuiz.id,

p_selected_option:
selected.value
}
);


if(error){

submitButton.disabled =
false;

submitButton.textContent =
"Submit Answer";

showMessage(
"Unable to submit quiz: " +
error.message,
"error"
);

return;

}


if(!data || !data.success){

submitButton.disabled =
false;

submitButton.textContent =
"Submit Answer";

showMessage(
data && data.message
? data.message
: "Unable to submit quiz.",
"error"
);

return;

}


document
.querySelectorAll(
'input[name="quizOption"]'
)
.forEach(function(input){

input.disabled =
true;

});


if(data.correct){

showMessage(
data.message,
"success"
);

const reward =
document.getElementById(
"reward"
);

const rewardText =
document.getElementById(
"rewardText"
);

const rewardAmount =
Number(
data.reward_amount || 0
).toFixed(2);

rewardText.textContent =
data.reward_points +
" points earned • $" +
rewardAmount +
" added to your wallet.";

reward.style.display =
"block";

}else{

showMessage(
data.message,
"info"
);

}

submitButton.textContent =
"Quiz Completed";

}


async function init(){

const loggedIn =
await checkLogin();

if(!loggedIn){
return;
}

await loadQuiz();

if(currentQuiz){

await checkPreviousAttempt();

}

}


init();

</script>

</body>
</html>
