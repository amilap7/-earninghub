<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Tasks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:28px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
padding:10px 14px;
border:1px solid #111;
border-radius:10px;
text-decoration:none;
color:#111;
font-weight:bold
}

h1{
font-size:30px;
margin-bottom:8px
}

.subtitle{
color:#777;
font-size:14px;
margin-bottom:22px
}

.card{
border:1px solid #ddd;
border-radius:18px;
padding:18px;
margin-bottom:15px
}

.platform{
font-size:12px;
color:#777;
margin-bottom:7px
}

.name{
font-size:19px;
font-weight:700
}

.reward{
font-size:19px;
font-weight:800;
margin-top:12px
}

.description{
font-size:13px;
color:#666;
line-height:1.5;
margin-top:10px
}

.status{
display:inline-block;
margin-top:12px;
padding:7px 10px;
border-radius:8px;
background:#f2f2f2;
font-size:12px
}

.view{
display:block;
margin-top:15px;
padding:13px;
background:#111;
color:#fff;
border-radius:11px;
text-align:center;
text-decoration:none;
font-weight:bold
}

.message{
padding:40px 15px;
text-align:center;
color:#777;
line-height:1.5
}

.error{
padding:15px;
background:#f3f3f3;
border-radius:12px;
font-size:13px;
line-height:1.5
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<a
class="back"
href="dashboard.html">
Back
</a>

</header>

<h1>
Available Tasks
</h1>

<p class="subtitle">
Complete available campaigns and earn rewards.
</p>

<div id="tasks">

<div class="message">
Loading campaigns...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function loadCampaigns(){

const box =
document.getElementById("tasks");


const {
data,
error
} =
await client
.from("campaigns")
.select(
"id,title,description,platform,task_type,target_url,reward,budget,status,created_at"
)
.eq(
"status",
"active"
)
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML=`

<div class="error">

<b>Unable to load campaigns.</b>

<br><br>

${escapeHTML(error.message)}

</div>

`;

return;

}


if(!data || data.length===0){

box.innerHTML=`

<div class="message">

No campaigns available.

<br><br>

Check again later for new earning opportunities.

</div>

`;

return;

}


box.innerHTML =
data.map(c => {

const campaign =
encodeURIComponent(
JSON.stringify(c)
);

return `

<div class="card">

<div class="platform">

${escapeHTML(c.platform)}

</div>

<div class="name">

${escapeHTML(c.title)}

</div>

<div class="reward">

Reward: $${Number(
c.reward || 0
).toFixed(2)}

</div>

<div class="description">

${escapeHTML(c.description)}

</div>

<div class="status">

Status: ${escapeHTML(c.status)}

</div>

<a
class="view"
href="task2.html?campaign=${campaign}">

View Task

</a>

</div>

`;

}).join("");

}


loadCampaigns();

</script>

</body>
</html>
