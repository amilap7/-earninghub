<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Withdraw</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
text-decoration:none;
color:#111
}

h1{
font-size:30px;
margin-bottom:8px
}

.subtitle{
color:#777;
font-size:14px;
margin-bottom:22px
}

.balance{
background:#111;
color:#fff;
border-radius:20px;
padding:22px;
margin-bottom:15px
}

.balance small{
color:#ccc
}

.balance strong{
display:block;
font-size:34px;
margin-top:7px
}

.minimum{
border:1px solid #ddd;
border-radius:14px;
padding:15px;
margin-bottom:22px;
font-size:13px;
line-height:1.5
}

.minimum strong{
font-size:15px
}

.section-title{
font-size:19px;
font-weight:bold;
margin-bottom:12px
}

.method{
width:100%;
border:1px solid #ddd;
border-radius:16px;
padding:17px;
background:#fff;
text-align:left;
margin-bottom:12px;
cursor:pointer;
font-size:15px;
position:relative
}

.method-name{
font-weight:bold;
font-size:16px
}

.method-description{
font-size:12px;
color:#777;
margin-top:5px;
line-height:1.4
}

.method.disabled{
opacity:.45;
cursor:not-allowed
}

.method.available{
border-color:#111
}

.badge{
position:absolute;
right:15px;
top:16px;
font-size:11px;
font-weight:bold;
padding:5px 8px;
border-radius:7px;
background:#eee
}

.available .badge{
background:#111;
color:#fff
}

.message{
display:none;
margin-bottom:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<a
class="back"
href="wallet.html">
Back
</a>

</header>

<h1>
Withdraw
</h1>

<p class="subtitle">
Choose your preferred withdrawal method.
</p>

<div
id="message"
class="message">
</div>

<div class="balance">

<small>
Available balance
</small>

<strong id="balance">
$0.00
</strong>

</div>

<div class="minimum">

<strong>
Minimum payout: $10.00
</strong>

<br>

You can select a withdrawal method when your available balance reaches $10.00 or more.

</div>

<div class="section-title">
Payment Methods
</div>

<div id="methods">

<button
class="method disabled"
disabled>

<span class="method-name">
Payoneer
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
International payment and withdrawal service.
</div>

</button>


<button
class="method disabled"
disabled>

<span class="method-name">
PayPal
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
Online payment and international withdrawal service.
</div>

</button>


<button
class="method disabled"
disabled>

<span class="method-name">
Bank Transfer
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
Withdraw directly to an eligible bank account.
</div>

</button>


<button
class="method disabled"
disabled>

<span class="method-name">
Wise
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
International money transfer and receiving option.
</div>

</button>


<button
class="method disabled"
disabled>

<span class="method-name">
Skrill
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
Digital wallet withdrawal option.
</div>

</button>


<button
class="method disabled"
disabled>

<span class="method-name">
Crypto
</span>

<span class="badge">
Locked
</span>

<div class="method-description">
Supported cryptocurrency withdrawal option.
</div>

</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const MINIMUM_PAYOUT =
10;


function showMessage(text){

const message =
document.getElementById("message");

message.textContent =
text;

message.style.display =
"block";

}


async function loadWallet(){

const {
data:sessionData,
error:sessionError
} =
await client.auth.getSession();


if(sessionError){

showMessage(
"Session error: " +
sessionError.message
);

return;

}


if(!sessionData.session){

showMessage(
"Please login first."
);

return;

}


const userId =
sessionData.session.user.id;


const {
data,
error
} =
await client
.from("wallets")
.select(
"user_id,balance"
)
.eq(
"user_id",
userId
)
.maybeSingle();


if(error){

showMessage(
"Unable to load wallet: " +
error.message
);

return;

}


const balance =
Number(
data?.balance || 0
);


document.getElementById(
"balance"
).textContent =
"$" +
balance.toFixed(2);


updateMethods(
balance
);

}


function updateMethods(balance){

const methods =
document.querySelectorAll(
".method"
);


methods.forEach(
function(method){

const badge =
method.querySelector(
".badge"
);


if(balance >= MINIMUM_PAYOUT){

method.disabled =
false;

method.classList.remove(
"disabled"
);

method.classList.add(
"available"
);

badge.textContent =
"Available";


method.onclick =
function(){

showMessage(
"Withdrawal method selected. Withdrawal setup will be available soon."
);

};

}else{

method.disabled =
true;

method.classList.add(
"disabled"
);

method.classList.remove(
"available"
);

badge.textContent =
"Locked";

}

});

}


loadWallet();

</script>

</body>
</html>
