<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transaction History - EarningHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .back {
      text-decoration: none;
      color: #111111;
      font-size: 28px;
      font-weight: bold;
      line-height: 1;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
    }

    .top-space {
      width: 28px;
    }

    .wallet-card {
      background: #111111;
      color: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: center;
    }

    .wallet-label {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 6px;
    }

    .wallet-balance {
      font-size: 28px;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 3px;
    }

    .filter-btn {
      flex: 0 0 auto;
      border: 1px solid #dddddd;
      background: #ffffff;
      color: #111111;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .transactions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border: 1px solid #e5e5e5;
      border-radius: 13px;
      background: #ffffff;
    }

    .transaction-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .transaction-info {
      flex: 1;
      min-width: 0;
    }

    .transaction-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .transaction-description {
      font-size: 12px;
      color: #666666;
      line-height: 1.4;
      word-break: break-word;
    }

    .transaction-date {
      font-size: 11px;
      color: #999999;
      margin-top: 4px;
    }

    .transaction-amount {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .transaction-amount.earned {
      color: #111111;
    }

    .transaction-amount.withdrawal {
      color: #777777;
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #666666;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fafafa;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .empty-text {
      font-size: 13px;
      color: #666666;
      line-height: 1.5;
    }

    .login-box {
      text-align: center;
      padding: 35px 20px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fafafa;
    }

    .login-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .login-text {
      color: #666666;
      font-size: 13px;
      line-height: 1.5;
    }

    .login-btn {
      display: inline-block;
      margin-top: 14px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .error-box {
      padding: 15px;
      border-radius: 12px;
      background: #ffeaea;
      color: #a00000;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <a href="dashboard.html" class="back">
      ‹
    </a>

    <div class="title">
      Transaction History
    </div>

    <div class="top-space"></div>

  </div>


  <!-- WALLET BALANCE -->

  <div class="wallet-card">

    <div class="wallet-label">
      Current Wallet Balance
    </div>

    <div
      class="wallet-balance"
      id="walletBalance">
      $0.00
    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button
      class="filter-btn active"
      data-filter="all"
      onclick="setFilter('all')">
      All
    </button>

    <button
      class="filter-btn"
      data-filter="earned"
      onclick="setFilter('earned')">
      Earned
    </button>

    <button
      class="filter-btn"
      data-filter="ads"
      onclick="setFilter('ads')">
      Watch Ads
    </button>

    <button
      class="filter-btn"
      data-filter="tasks"
      onclick="setFilter('tasks')">
      Tasks
    </button>

    <button
      class="filter-btn"
      data-filter="quiz"
      onclick="setFilter('quiz')">
      Quiz
    </button>

    <button
      class="filter-btn"
      data-filter="spin"
      onclick="setFilter('spin')">
      Spin
    </button>

    <button
      class="filter-btn"
      data-filter="referral"
      onclick="setFilter('referral')">
      Referral
    </button>

    <button
      class="filter-btn"
      data-filter="withdrawal"
      onclick="setFilter('withdrawal')">
      Withdrawals
    </button>

  </div>


  <!-- TRANSACTIONS -->

  <div
    id="transactionsArea"
    class="transactions">

    <div class="loading">
      Loading transaction history...
    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let allTransactions = [];

let currentFilter = "all";


/* =========================================================
   GET USER
========================================================= */

async function loadUser() {

  const {
    data,
    error
  } = await client.auth.getUser();

  if (error) {

    console.error(error);

    showLogin();

    return false;
  }

  if (!data || !data.user) {

    showLogin();

    return false;
  }

  currentUser = data.user;

  return true;
}


/* =========================================================
   LOGIN
========================================================= */

function showLogin() {

  document.getElementById(
    "transactionsArea"
  ).innerHTML = `

    <div class="login-box">

      <div class="login-title">
        Login Required
      </div>

      <div class="login-text">
        Please login to view your transaction history.
      </div>

      <a
        href="login.html"
        class="login-btn">
        Login
      </a>

    </div>

  `;
}


/* =========================================================
   LOAD WALLET
========================================================= */

async function loadWallet() {

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } = await client
    .from("wallets")
    .select("balance")
    .eq(
      "user_id",
      currentUser.id
    )
    .maybeSingle();

  if (error) {

    console.error(
      "Wallet error:",
      error
    );

    return;
  }

  const balance =
    Number(
      data?.balance || 0
    );

  document.getElementById(
    "walletBalance"
  ).textContent =
    "$" + balance.toFixed(2);
}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions() {

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } = await client
    .from("transactions")
    .select(
      "id, type, amount, description, created_at"
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );

  if (error) {

    console.error(
      "Transaction error:",
      error
    );

    document.getElementById(
      "transactionsArea"
    ).innerHTML = `

      <div class="error-box">
        Could not load transaction history.
        Please try again later.
      </div>

    `;

    return;
  }

  allTransactions =
    data || [];

  renderTransactions();
}


/* =========================================================
   TRANSACTION TYPE
========================================================= */

function getTransactionInfo(transaction) {

  const type =
    String(
      transaction.type || ""
    ).toLowerCase();

  const description =
    String(
      transaction.description || ""
    ).toLowerCase();


  /* WATCH ADS */

  if (
    type.includes("ad") ||
    description.includes("watch ads") ||
    description.includes("ad #")
  ) {

    return {
      category: "ads",
      title: "Watch Ads",
      icon: "💰"
    };

  }


  /* TASKS */

  if (
    type.includes("task") ||
    description.includes("task")
  ) {

    return {
      category: "tasks",
      title: "Task Reward",
      icon: "✅"
    };

  }


  /* QUIZ */

  if (
    type.includes("quiz") ||
    description.includes("quiz")
  ) {

    return {
      category: "quiz",
      title: "Daily Quiz",
      icon: "🧠"
    };

  }


  /* SPIN */

  if (
    type.includes("spin") ||
    description.includes("spin")
  ) {

    return {
      category: "spin",
      title: "Spin & Win",
      icon: "🎡"
    };

  }


  /* REFERRAL */

  if (
    type.includes("referral") ||
    description.includes("referral")
  ) {

    return {
      category: "referral",
      title: "Referral Reward",
      icon: "👥"
    };

  }


  /* WITHDRAWAL */

  if (
    type.includes("withdraw") ||
    description.includes("withdraw")
  ) {

    return {
      category: "withdrawal",
      title: "Withdrawal",
      icon: "💸"
    };

  }


  /* OTHER EARNINGS */

  return {
    category: "earned",
    title: "Reward",
    icon: "⭐"
  };
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString) {

  if (!dateString) {
    return "";
  }

  const date =
    new Date(dateString);

  return date.toLocaleString(
    "en-US",
    {
      timeZone: "Asia/Colombo",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions() {

  const area =
    document.getElementById(
      "transactionsArea"
    );


  let filtered =
    allTransactions.filter(
      transaction => {

        const info =
          getTransactionInfo(
            transaction
          );


        if (
          currentFilter ===
          "all"
        ) {

          return true;

        }


        if (
          currentFilter ===
          "earned"
        ) {

          return (
            info.category !==
            "withdrawal"
          );

        }


        return (
          info.category ===
          currentFilter
        );

      }
    );


  /* =======================================================
     EMPTY
  ======================================================= */

  if (
    filtered.length === 0
  ) {

    area.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📜
        </div>

        <div class="empty-title">
          No Transactions
        </div>

        <div class="empty-text">
          Your transaction history
          will appear here when you
          earn or withdraw money.
        </div>

      </div>

    `;

    return;
  }


  /* =======================================================
     TRANSACTION CARDS
  ======================================================= */

  area.innerHTML =
    filtered
      .map(transaction => {

        const info =
          getTransactionInfo(
            transaction
          );


        const amount =
          Number(
            transaction.amount || 0
          );


        const isWithdrawal =
          info.category ===
          "withdrawal";


        const amountText =
          (isWithdrawal
            ? "-"
            : "+") +
          "$" +
          Math.abs(
            amount
          ).toFixed(2);


        return `

          <div
            class="transaction">

            <div class="transaction-icon">
              ${info.icon}
            </div>

            <div class="transaction-info">

              <div class="transaction-title">
                ${escapeHtml(
                  info.title
                )}
              </div>

              <div class="transaction-description">
                ${escapeHtml(
                  transaction.description ||
                  transaction.type ||
                  "Transaction"
                )}
              </div>

              <div class="transaction-date">
                ${formatDate(
                  transaction.created_at
                )}
              </div>

            </div>

            <div
              class="transaction-amount ${
                isWithdrawal
                  ? "withdrawal"
                  : "earned"
              }">

              ${amountText}

            </div>

          </div>

        `;

      })
      .join("");
}


/* =========================================================
   FILTER
========================================================= */

function setFilter(filter) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.filter ===
        filter
      );

    });


  renderTransactions();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

  const loggedIn =
    await loadUser();

  if (!loggedIn) {
    return;
  }

  await loadWallet();

  await loadTransactions();
}


/* =========================================================
   START
========================================================= */

initialize();

</script>

</body>
</html>
