<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>EarningHub Privacy</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:700px;
min-height:100vh;
margin:auto;
padding:0 20px 30px
}


/* APP BAR */

header{
height:90px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:3px solid #111;
background:#fff
}

.back-button{
width:40px;
height:40px;
border:0;
background:#fff;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.back-button:active{
background:#f3f3f3
}

.back-button svg{
width:23px;
height:23px;
stroke:#111;
stroke-width:2;
fill:none;
stroke-linecap:round;
stroke-linejoin:round
}

.logo{
width:105px;
height:auto;
display:block;
object-fit:contain
}

.header-space{
width:40px
}


/* MAIN */

.main{
padding-top:25px
}

.page-title{
margin-bottom:25px
}

.page-title small{
color:#777;
font-size:13px
}

.page-title h1{
font-size:28px;
margin-top:6px
}


/* PRIVACY */

.privacy{
display:flex;
flex-direction:column;
gap:12px
}

.privacy-card{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
background:#fff
}

.privacy-card h2{
font-size:16px;
margin-bottom:7px
}

.privacy-card p{
font-size:13px;
color:#777;
line-height:1.6
}


/* PRIVACY BUTTON */

.privacy-button{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
border:0;
background:#fff;
color:#111;
padding:0;
text-align:left;
cursor:pointer
}

.privacy-left{
display:flex;
align-items:center;
gap:13px
}

.privacy-icon{
width:40px;
height:40px;
border-radius:10px;
background:#f3f3f3;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex-shrink:0
}

.privacy-arrow{
font-size:20px;
color:#777
}


/* INFORMATION */

.info{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
margin-top:20px
}

.info strong{
font-size:15px
}

.info p{
font-size:13px;
color:#777;
line-height:1.6;
margin-top:7px
}


/* FOOTER */

footer{
text-align:center;
padding:35px 0 20px;
color:#888;
font-size:12px
}


/* MOBILE */

@media(max-width:600px){

.app{
max-width:480px;
padding:0 20px 20px
}

header{
height:90px
}

.logo{
width:105px
}

.page-title h1{
font-size:26px
}

}

</style>

</head>


<body>

<div class="app">


<!-- APP BAR -->

<header>


<button
class="back-button"
type="button"
onclick="goSettings()"
aria-label="Back"
>

<svg viewBox="0 0 24 24">

<line
x1="19"
y1="12"
x2="5"
y2="12">
</line>

<polyline
points="12 19 5 12 12 5">
</polyline>

</svg>

</button>


<img
class="logo"
src="./logo.PNG"
alt="EarningHub Logo"
>


<div class="header-space"></div>


</header>


<!-- MAIN -->

<div class="main">


<div class="page-title">

<small>
EarningHub
</small>

<h1>
Privacy
</h1>

</div>


<div class="privacy">


<!-- PROFILE PRIVACY -->

<div class="privacy-card">

<button
class="privacy-button"
type="button"
onclick="showPrivacyMessage('Your profile information is only used to provide EarningHub account features.')"
>

<div class="privacy-left">

<div class="privacy-icon">
👤
</div>

<div>

<h2>
Profile Privacy
</h2>

<p>
Manage how your profile information is used.
</p>

</div>

</div>

<div class="privacy-arrow">
›
</div>

</button>

</div>


<!-- DATA -->

<div class="privacy-card">

<button
class="privacy-button"
type="button"
onclick="showPrivacyMessage('EarningHub uses your account data to provide tasks, campaigns, wallet and other services.')"
>

<div class="privacy-left">

<div class="privacy-icon">
📊
</div>

<div>

<h2>
Your Data
</h2>

<p>
Learn how your account data is used by EarningHub.
</p>

</div>

</div>

<div class="privacy-arrow">
›
</div>

</button>

</div>


<!-- ACTIVITY -->

<div class="privacy-card">

<button
class="privacy-button"
type="button"
onclick="showPrivacyMessage('Your EarningHub activity is used to provide earning and account features.')"
>

<div class="privacy-left">

<div class="privacy-icon">
📋
</div>

<div>

<h2>
Activity Privacy
</h2>

<p>
Information about your EarningHub activity and tasks.
</p>

</div>

</div>

<div class="privacy-arrow">
›
</div>

</button>

</div>


<!-- SECURITY -->

<div class="privacy-card">

<button
class="privacy-button"
type="button"
onclick="showPrivacyMessage('Keep your account login details private and never share your password.')"
>

<div class="privacy-left">

<div class="privacy-icon">
🛡️
</div>

<div>

<h2>
Privacy & Security
</h2>

<p>
Keep your personal account information protected.
</p>

</div>

</div>

<div class="privacy-arrow">
›
</div>

</button>

</div>


</div>


<!-- INFORMATION -->

<div class="info">

<strong>
EarningHub Privacy
</strong>

<p>
We aim to keep your account information secure and use your data only to provide and improve EarningHub services.
</p>

</div>


<footer>

© 2026 EarningHub

</footer>


</div>

</div>


<script>


/*
GO TO SETTINGS
*/

function goSettings(){

window.location.href =
"settings.html";

}


/*
PRIVACY MESSAGE
*/

function showPrivacyMessage(message){

alert(message);

}

</script>


</body>

</html>
