<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin - Daily Quiz | EarningHub</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:600px;
margin:auto;
min-height:100vh;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:22px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
color:#111;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
text-decoration:none
}

.title{
margin:10px 0 25px
}

.title small{
color:#777
}

.title h1{
font-size:28px;
margin-top:6px
}

.card{
border:1px solid #ddd;
border-radius:18px;
padding:20px;
margin-bottom:20px
}

.card h2{
font-size:18px;
margin-bottom:18px
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
border:1px solid #ccc;
border-radius:10px;
padding:13px;
font-size:15px;
outline:none;
background:#fff;
color:#111
}

textarea{
min-height:110px;
resize:vertical
}

.field{
margin-bottom:16px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.button{
width:100%;
border:0;
border-radius:11px;
background:#111;
color:#fff;
padding:14px;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.button:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
display:none;
padding:13px;
border-radius:10px;
font-size:13px;
line-height:1.5;
margin-bottom:15px
}

.status.show{
display:block
}

.status.success{
background:#eaf8ee;
color:#176b35
}

.status.error{
background:#fff0f0;
color:#a21d1d
}

.quiz-info{
background:#f7f7f7;
border-radius:12px;
padding:14px;
font-size:13px;
color:#555;
line-height:1.6;
margin-bottom:18px
}

.loading{
text-align:center;
padding:30px;
color:#777
}

.empty{
border:1px solid #ddd;
border-radius:14px;
padding:20px;
text-align:center;
color:#777;
font-size:13px;
line-height:1.5
}

.quiz-history{
border:1px solid #ddd;
border-radius:18px;
padding:20px;
margin-bottom:20px
}

.quiz-history h2{
font-size:18px;
margin-bottom:16px
}

.history-item{
border:1px solid #ddd;
border-radius:14px;
padding:15px;
margin-bottom:12px
}

.history-item:last-child{
margin-bottom:0
}

.history-question{
font-size:15px;
font-weight:bold;
line-height:1.4;
margin-bottom:10px
}

.history-meta{
font-size:12px;
color:#777;
line-height:1.7;
margin-bottom:12px
}

.history-status{
display:inline-block;
padding:5px 9px;
border-radius:999px;
font-size:11px;
font-weight:bold;
margin-bottom:10px
}

.history-status.active{
background:#eaf8ee;
color:#176b35
}

.history-status.inactive{
background:#f1f1f1;
color:#666
}

.delete-button{
width:100%;
border:1px solid #d00000;
border-radius:10px;
background:#fff;
color:#d00000;
padding:11px;
font-size:13px;
font-weight:bold;
cursor:pointer
}

.delete-button:disabled{
opacity:.5;
cursor:not-allowed
}

.reactive-button{
width:100%;
border:1px solid #176b35;
border-radius:10px;
background:#fff;
color:#176b35;
padding:11px;
font-size:13px;
font-weight:bold;
cursor:pointer;
margin-top:8px
}

.reactive-button:disabled{
opacity:.5;
cursor:not-allowed
}

footer{
text-align:center;
padding:30px 0 20px;
color:#888;
font-size:12px
}

@media(max-width:420px){

.app{
padding:15px
}

.grid{
grid-template-columns:1fr
}

}

</style>

</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub Admin
</div>

<a href="admin.html" class="back">
Back
</a>

</header>


<div class="title">

<small>Admin Panel</small>

<h1>Daily Quiz</h1>

</div>


<div id="loading" class="loading">
Checking admin access...
</div>


<div id="adminContent" style="display:none">


<div id="status" class="status"></div>


<div class="card">

<h2>Today's Quiz</h2>

<div class="quiz-info">

Create or update today's quiz.

<br>

<strong>Reward:</strong>
1000 Points = $2.00

<br>

If you enter 100 points, the user receives $0.20.

</div>


<form id="quizForm">


<div class="field">

<label for="question">
Question
</label>

<textarea
id="question"
placeholder="Enter today's quiz question"
required
></textarea>

</div>


<div class="grid">


<div class="field">

<label for="optionA">
Option A
</label>

<input
id="optionA"
type="text"
placeholder="Option A"
required
>

</div>


<div class="field">

<label for="optionB">
Option B
</label>

<input
id="optionB"
type="text"
placeholder="Option B"
required
>

</div>


<div class="field">

<label for="optionC">
Option C
</label>

<input
id="optionC"
type="text"
placeholder="Option C"
required
>

</div>


<div class="field">

<label for="optionD">
Option D
</label>

<input
id="optionD"
type="text"
placeholder="Option D"
required
>

</div>

</div>


<div class="field">

<label for="correctOption">
Correct Answer
</label>

<select id="correctOption">

<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>

</select>

</div>


<div class="grid">


<div class="field">

<label for="rewardPoints">
Reward Points
</label>

<input
id="rewardPoints"
type="number"
min="1"
value="100"
required
>

</div>


<div class="field">

<label for="quizDate">
Quiz Date
</label>

<input
id="quizDate"
type="date"
required
>

</div>

</div>


<div class="field">

<label for="isActive">
Status
</label>

<select id="isActive">

<option value="true">
Active
</option>

<option value="false">
Inactive
</option>

</select>

</div>


<button
class="button"
type="submit"
id="saveButton"
>

Save Today's Quiz

</button>


</form>

</div>


<!-- SAVED DAILY QUIZZES -->

<div class="quiz-history">

<h2>
Saved Daily Quizzes
</h2>

<div
id="historyLoading"
class="loading">
Loading saved quizzes...
</div>

<div
id="quizHistoryList">
</div>

</div>


</div>


<footer>
© 2026 EarningHub
</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loading =
document.getElementById("loading");

const adminContent =
document.getElementById("adminContent");

const statusBox =
document.getElementById("status");

const quizForm =
document.getElementById("quizForm");

const saveButton =
document.getElementById("saveButton");


function showStatus(message,type){

statusBox.textContent =
message;

statusBox.className =
"status show " + type;

}


function getToday(){

const now = new Date();

const year =
now.getFullYear();

const month =
String(now.getMonth()+1)
.padStart(2,"0");

const day =
String(now.getDate())
.padStart(2,"0");

return `${year}-${month}-${day}`;

}


function clearQuizForm(){

document.getElementById(
"question"
).value = "";

document.getElementById(
"optionA"
).value = "";

document.getElementById(
"optionB"
).value = "";

document.getElementById(
"optionC"
).value = "";

document.getElementById(
"optionD"
).value = "";

document.getElementById(
"correctOption"
).value = "A";

document.getElementById(
"rewardPoints"
).value = "100";

document.getElementById(
"quizDate"
).value = getToday();

document.getElementById(
"isActive"
).value = "true";

}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   LOAD SAVED QUIZZES
========================= */

async function loadQuizHistory(){

const historyLoading =
document.getElementById(
"historyLoading"
);

const historyList =
document.getElementById(
"quizHistoryList"
);

historyLoading.style.display =
"block";

historyList.innerHTML =
"";


const {
data,
error
} =
await client
.from("daily_quizzes")
.select(
"id,question,option_a,option_b,option_c,option_d,reward_points,quiz_date,quiz_number,is_active,correct_option"
)
.order(
"quiz_date",
{
ascending:false
}
)
.order(
"quiz_number",
{
ascending:true
}
);


historyLoading.style.display =
"none";


if(error){

historyList.innerHTML =
'<div class="empty">' +
"Unable to load saved quizzes: " +
escapeHtml(error.message) +
"</div>";

return;

}


if(!data || !data.length){

historyList.innerHTML =
'<div class="empty">' +
"No saved daily quizzes found." +
"</div>";

return;

}


data.forEach(
function(quiz){

const item =
document.createElement(
"div"
);

item.className =
"history-item";

const statusClass =
quiz.is_active
?
"active"
:
"inactive";

const statusText =
quiz.is_active
?
"Active"
:
"Inactive";


item.innerHTML =

'<div class="history-question">' +
escapeHtml(
quiz.question
) +
"</div>" +

'<div class="history-meta">' +

"<strong>Date:</strong> " +
escapeHtml(
quiz.quiz_date
) +

"<br>" +

"<strong>Quiz Number:</strong> " +
escapeHtml(
quiz.quiz_number
) +

"<br>" +

"<strong>Reward Points:</strong> " +
escapeHtml(
quiz.reward_points
) +

"<br>" +

"<strong>Correct Answer:</strong> " +
escapeHtml(
quiz.correct_option || "Not available"
) +

"</div>" +

'<span class="history-status ' +
statusClass +
'">' +
statusText +
"</span>" +

'<button ' +
'class="delete-button" ' +
'onclick="deleteQuiz(\'' +
quiz.id +
'\',this)">' +
"Delete Quiz" +
"</button>" +

'<button ' +
'class="reactive-button" ' +
'onclick="reactivateQuiz(\'' +
quiz.id +
'\',this)">' +
"Reactive" +
"</button>";

historyList.appendChild(
item
);

}
);

}


/* =========================
   DELETE QUIZ
========================= */

async function deleteQuiz(
quizId,
button
){

const confirmed =
confirm(
"Are you sure you want to delete this quiz?\n\n" +
"This quiz will be permanently removed and users will no longer be able to see or answer it."
);


if(!confirmed){

return;

}


button.disabled =
true;

button.textContent =
"Deleting...";


try{

const {
data,
error
} =
await client.rpc(
"admin_delete_daily_quiz",
{
p_quiz_id:quizId
}
);


if(error){
throw error;
}


if(
!data ||
data.success !== true
){

throw new Error(
data?.message ||
"Could not delete quiz."
);

}


showStatus(
"Quiz deleted successfully. Users can no longer see this quiz.",
"success"
);


await loadQuizHistory();


}catch(error){

console.error(error);

button.disabled =
false;

button.textContent =
"Delete Quiz";

showStatus(
error.message ||
"Unable to delete quiz.",
"error"
);

}

}


/* =========================
   REACTIVATE QUIZ
========================= */

async function reactivateQuiz(
quizId,
button
){

button.disabled =
true;

button.textContent =
"Reactivating...";


try{

const {
data,
error
} =
await client.rpc(
"admin_reactivate_daily_quiz",
{
p_quiz_id:quizId
}
);


if(error){
throw error;
}


if(
!data ||
data.success !== true
){

throw new Error(
data?.message ||
"Could not reactivate quiz."
);

}


showStatus(
"Quiz reactivated successfully. Users can now see this quiz.",
"success"
);


await loadQuizHistory();


}catch(error){

console.error(error);

button.disabled =
false;

button.textContent =
"Reactive";

showStatus(
error.message ||
"Unable to reactivate quiz.",
"error"
);

}

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

try{

const {data,error} =
await client.auth.getSession();

if(error){
throw error;
}

if(!data.session){

window.location.href =
"index.html";

return;
}


const userId =
data.session.user.id;


const {data:profile,error:profileError} =
await client
.from("profiles")
.select("is_admin")
.eq("id",userId)
.maybeSingle();


if(profileError){
throw profileError;
}


if(!profile || profile.is_admin !== true){

loading.textContent =
"Access denied.";

return;
}


loading.style.display =
"none";

adminContent.style.display =
"block";


document.getElementById("quizDate").value =
getToday();


await loadQuizHistory();


}catch(error){

console.error(error);

loading.textContent =
"Unable to verify admin access.";

}

}


quizForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


saveButton.disabled = true;

saveButton.textContent =
"Saving...";


try{

const question =
document.getElementById("question")
.value.trim();

const optionA =
document.getElementById("optionA")
.value.trim();

const optionB =
document.getElementById("optionB")
.value.trim();

const optionC =
document.getElementById("optionC")
.value.trim();

const optionD =
document.getElementById("optionD")
.value.trim();

const correctOption =
document.getElementById("correctOption")
.value;

const rewardPoints =
parseInt(
document.getElementById("rewardPoints")
.value,
10
);

const quizDate =
document.getElementById("quizDate")
.value;

const isActive =
document.getElementById("isActive")
.value === "true";


if(!question ||
!optionA ||
!optionB ||
!optionC ||
!optionD){

showStatus(
"Please fill all fields.",
"error"
);

return;

}


if(!rewardPoints || rewardPoints <= 0){

showStatus(
"Reward points must be greater than 0.",
"error"
);

return;

}


if(!quizDate){

showStatus(
"Please select a quiz date.",
"error"
);

return;

}


const {data,error} =
await client.rpc(
"admin_save_daily_quiz",
{
p_question:question,
p_option_a:optionA,
p_option_b:optionB,
p_option_c:optionC,
p_option_d:optionD,
p_correct_option:correctOption,
p_reward_points:rewardPoints,
p_quiz_date:quizDate,
p_is_active:isActive
}
);


if(error){
throw error;
}


if(!data || data.success !== true){

showStatus(
data?.message ||
"Could not save quiz.",
"error"
);

return;

}


clearQuizForm();


showStatus(
data.message ||
"Quiz saved successfully. Enter the next quiz.",
"success"
);


await loadQuizHistory();


}catch(error){

console.error(error);

showStatus(
error.message ||
"Something went wrong.",
"error"
);

}finally{

saveButton.disabled = false;

saveButton.textContent =
"Save Today's Quiz";

}

});


checkAdmin();

</script>

</body>
</html>
