<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin - Daily Quiz | EarningHub</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:600px;
margin:auto;
min-height:100vh;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:22px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
color:#111;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
text-decoration:none
}

.title{
margin:10px 0 25px
}

.title small{
color:#777
}

.title h1{
font-size:28px;
margin-top:6px
}

.card{
border:1px solid #ddd;
border-radius:18px;
padding:20px;
margin-bottom:20px
}

.card h2{
font-size:18px;
margin-bottom:18px
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px
}

input,
textarea,
select{
width:100%;
border:1px solid #ccc;
border-radius:10px;
padding:13px;
font-size:15px;
outline:none;
background:#fff;
color:#111
}

textarea{
min-height:110px;
resize:vertical
}

.field{
margin-bottom:16px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.button{
width:100%;
border:0;
border-radius:11px;
background:#111;
color:#fff;
padding:14px;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.button:disabled{
opacity:.5;
cursor:not-allowed
}

.status{
display:none;
padding:13px;
border-radius:10px;
font-size:13px;
line-height:1.5;
margin-bottom:15px
}

.status.show{
display:block
}

.status.success{
background:#eaf8ee;
color:#176b35
}

.status.error{
background:#fff0f0;
color:#a21d1d
}

.quiz-info{
background:#f7f7f7;
border-radius:12px;
padding:14px;
font-size:13px;
color:#555;
line-height:1.6;
margin-bottom:18px
}

.loading{
text-align:center;
padding:30px;
color:#777
}

footer{
text-align:center;
padding:30px 0 20px;
color:#888;
font-size:12px
}

@media(max-width:420px){

.app{
padding:15px
}

.grid{
grid-template-columns:1fr
}

}

</style>

</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub Admin
</div>

<a href="admin.html" class="back">
Back
</a>

</header>


<div class="title">

<small>Admin Panel</small>

<h1>Daily Quiz</h1>

</div>


<div id="loading" class="loading">
Checking admin access...
</div>


<div id="adminContent" style="display:none">


<div id="status" class="status"></div>


<div class="card">

<h2>Today's Quiz</h2>

<div class="quiz-info">

Create or update today's quiz.

<br>

<strong>Reward:</strong>
1000 Points = $2.00

<br>

If you enter 100 points, the user receives $0.20.

</div>


<form id="quizForm">


<div class="field">

<label for="question">
Question
</label>

<textarea
id="question"
placeholder="Enter today's quiz question"
required
></textarea>

</div>


<div class="grid">


<div class="field">

<label for="optionA">
Option A
</label>

<input
id="optionA"
type="text"
placeholder="Option A"
required
>

</div>


<div class="field">

<label for="optionB">
Option B
</label>

<input
id="optionB"
type="text"
placeholder="Option B"
required
>

</div>


<div class="field">

<label for="optionC">
Option C
</label>

<input
id="optionC"
type="text"
placeholder="Option C"
required
>

</div>


<div class="field">

<label for="optionD">
Option D
</label>

<input
id="optionD"
type="text"
placeholder="Option D"
required
>

</div>

</div>


<div class="field">

<label for="correctOption">
Correct Answer
</label>

<select id="correctOption">

<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>

</select>

</div>


<div class="grid">


<div class="field">

<label for="rewardPoints">
Reward Points
</label>

<input
id="rewardPoints"
type="number"
min="1"
value="100"
required
>

</div>


<div class="field">

<label for="quizDate">
Quiz Date
</label>

<input
id="quizDate"
type="date"
required
>

</div>

</div>


<div class="field">

<label for="isActive">
Status
</label>

<select id="isActive">

<option value="true">
Active
</option>

<option value="false">
Inactive
</option>

</select>

</div>


<button
class="button"
type="submit"
id="saveButton"
>

Save Today's Quiz

</button>


</form>

</div>


</div>


<footer>
© 2026 EarningHub
</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loading =
document.getElementById("loading");

const adminContent =
document.getElementById("adminContent");

const statusBox =
document.getElementById("status");

const quizForm =
document.getElementById("quizForm");

const saveButton =
document.getElementById("saveButton");


function showStatus(message,type){

statusBox.textContent = message;

statusBox.className =
"status show " + type;

}


function getToday(){

const now = new Date();

const year =
now.getFullYear();

const month =
String(now.getMonth()+1)
.padStart(2,"0");

const day =
String(now.getDate())
.padStart(2,"0");

return `${year}-${month}-${day}`;

}


async function checkAdmin(){

try{

const {data,error} =
await client.auth.getSession();

if(error){
throw error;
}

if(!data.session){

window.location.href =
"index.html";

return;
}


const userId =
data.session.user.id;


const {data:profile,error:profileError} =
await client
.from("profiles")
.select("is_admin")
.eq("id",userId)
.maybeSingle();


if(profileError){
throw profileError;
}


if(!profile || profile.is_admin !== true){

loading.textContent =
"Access denied.";

return;
}


loading.style.display =
"none";

adminContent.style.display =
"block";


document.getElementById("quizDate").value =
getToday();


await loadTodayQuiz();

}catch(error){

console.error(error);

loading.textContent =
"Unable to verify admin access.";

}

}


async function loadTodayQuiz(){

const today =
getToday();


const {data,error} =
await client
.from("daily_quizzes")
.select("*")
.eq("quiz_date",today)
.maybeSingle();


if(error){

console.error(error);

showStatus(
"Could not load today's quiz.",
"error"
);

return;
}


if(!data){

return;
}


document.getElementById("question").value =
data.question || "";

document.getElementById("optionA").value =
data.option_a || "";

document.getElementById("optionB").value =
data.option_b || "";

document.getElementById("optionC").value =
data.option_c || "";

document.getElementById("optionD").value =
data.option_d || "";

document.getElementById("correctOption").value =
data.correct_option || "A";

document.getElementById("rewardPoints").value =
data.reward_points || 100;

document.getElementById("quizDate").value =
data.quiz_date || today;

document.getElementById("isActive").value =
data.is_active ? "true" : "false";


showStatus(
"Today's existing quiz loaded. You can update it.",
"success"
);

}


quizForm.addEventListener(
"submit",
async function(event){

event.preventDefault();


saveButton.disabled = true;

saveButton.textContent =
"Saving...";


try{

const question =
document.getElementById("question")
.value.trim();

const optionA =
document.getElementById("optionA")
.value.trim();

const optionB =
document.getElementById("optionB")
.value.trim();

const optionC =
document.getElementById("optionC")
.value.trim();

const optionD =
document.getElementById("optionD")
.value.trim();

const correctOption =
document.getElementById("correctOption")
.value;

const rewardPoints =
parseInt(
document.getElementById("rewardPoints")
.value,
10
);

const quizDate =
document.getElementById("quizDate")
.value;

const isActive =
document.getElementById("isActive")
.value === "true";


if(!question ||
!optionA ||
!optionB ||
!optionC ||
!optionD){

showStatus(
"Please fill all fields.",
"error"
);

return;
}


if(!rewardPoints || rewardPoints <= 0){

showStatus(
"Reward points must be greater than 0.",
"error"
);

return;
}


if(!quizDate){

showStatus(
"Please select a quiz date.",
"error"
);

return;
}


const {data,error} =
await client.rpc(
"admin_save_daily_quiz",
{
p_question:question,
p_option_a:optionA,
p_option_b:optionB,
p_option_c:optionC,
p_option_d:optionD,
p_correct_option:correctOption,
p_reward_points:rewardPoints,
p_quiz_date:quizDate,
p_is_active:isActive
}
);


if(error){
throw error;
}


if(!data || data.success !== true){

showStatus(
data?.message ||
"Could not save quiz.",
"error"
);

return;
}


showStatus(
"Quiz saved successfully.",
"success"
);

}catch(error){

console.error(error);

showStatus(
error.message ||
"Something went wrong.",
"error"
);

}finally{

saveButton.disabled = false;

saveButton.textContent =
"Save Today's Quiz";

}

});


checkAdmin();

</script>

</body>
</html>
