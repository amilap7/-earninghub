<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Campaigns - EarningHub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .back-btn {
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
      padding: 9px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .page-title {
      margin-bottom: 18px;
    }

    .page-title h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .page-title p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .search-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #111;
    }

    #message {
      text-align: center;
      padding: 25px 10px;
      color: #666;
    }

    .campaign-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .campaign-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 17px;
    }

    .campaign-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .campaign-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .status {
      white-space: nowrap;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.active {
      background: #e8f7ed;
      color: #18743a;
    }

    .status.paused {
      background: #f1f1f1;
      color: #555;
    }

    .status.other {
      background: #fff3d6;
      color: #7a5600;
    }

    .creator {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      background: #f8f8f8;
      border-radius: 9px;
      padding: 10px;
    }

    .stat-label {
      font-size: 11px;
      color: #777;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }

    .progress {
      height: 7px;
      background: #e9e9e9;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #111;
      border-radius: 20px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 600;
    }

    .details-btn {
      background: #111;
      color: #fff;
      flex: 1;
    }

    .pause-btn {
      background: #eee;
      color: #111;
    }

    .activate-btn {
      background: #111;
      color: #fff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: #eee;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
    }

    .detail-row {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .detail-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      word-break: break-word;
    }

    .url-link {
      color: #111;
      text-decoration: underline;
      word-break: break-all;
    }

    @media (max-width: 700px) {
      .campaign-list {
        grid-template-columns: 1fr;
      }

      main {
        padding: 16px 12px 30px;
      }

      .campaign-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">EarningHub</div>
    <a class="back-btn" href="dashboard.html">← Dashboard</a>
  </div>
</header>

<main>

  <div class="page-title">
    <h1>Campaign Management</h1>
    <p>Manage and review all creator campaigns.</p>
  </div>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Search campaign title or creator username..."
      autocomplete="off"
    >
  </div>

  <div id="message">Loading campaigns...</div>

  <div id="campaignList" class="campaign-list"></div>

</main>

<div id="detailsModal" class="modal">
  <div class="modal-box">

    <div class="modal-header">
      <h2>Campaign Details</h2>
      <button class="close-btn" onclick="closeDetails()">×</button>
    </div>

    <div id="detailsContent"></div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://zsitqabyplglcppvuetj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let campaigns = [];

  async function checkAdmin() {
    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {
      document.getElementById("message").textContent =
        "Please login as an administrator.";
      return false;
    }

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("is_admin")
        .eq("id", session.user.id)
        .maybeSingle();

    if (
      profileError ||
      !profile ||
      profile.is_admin !== true
    ) {
      document.getElementById("message").textContent =
        "Access denied. Admin only.";
      return false;
    }

    return true;
  }

  async function loadCampaigns() {
    const allowed = await checkAdmin();

    if (!allowed) {
      return;
    }

    const {
      data,
      error
    } = await supabaseClient.rpc("admin_get_campaigns");

    if (error) {
      console.error(error);

      document.getElementById("message").textContent =
        "Failed to load campaigns.";

      return;
    }

    campaigns = data || [];

    renderCampaigns(campaigns);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatMoney(value) {
    const number = Number(value || 0);

    return "$" + number.toFixed(2);
  }

  function formatDate(value) {
    if (!value) {
      return "-";
    }

    return new Date(value).toLocaleString("en-US", {
      timeZone: "Asia/Colombo",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function getProgress(completed, capacity) {
    const c = Number(completed || 0);
    const cap = Number(capacity || 0);

    if (cap <= 0) {
      return 0;
    }

    return Math.min(100, Math.max(0, (c / cap) * 100));
  }

  function getStatusClass(status) {
    if (status === "active") {
      return "active";
    }

    if (status === "paused") {
      return "paused";
    }

    return "other";
  }

  function renderCampaigns(list) {
    const message = document.getElementById("message");
    const container = document.getElementById("campaignList");

    if (!list.length) {
      message.style.display = "block";
      message.textContent = "No campaigns found.";
      container.innerHTML = "";
      return;
    }

    message.style.display = "none";

    container.innerHTML = list.map(campaign => {

      const completed = Number(campaign.completed_tasks || 0);
      const capacity = Number(campaign.task_capacity || 0);
      const progress = getProgress(completed, capacity);

      const status = String(campaign.status || "")
        .toLowerCase();

      const safeTitle = escapeHtml(campaign.title);
      const safeCreator = escapeHtml(
        campaign.creator_username || "Unknown"
      );

      return `
        <div class="campaign-card">

          <div class="campaign-top">
            <div class="campaign-title">
              ${safeTitle || "Untitled Campaign"}
            </div>

            <div class="status ${getStatusClass(status)}">
              ${escapeHtml(status || "unknown")}
            </div>
          </div>

          <div class="creator">
            👤 ${safeCreator}
          </div>

          <div class="stats">

            <div class="stat">
              <div class="stat-label">Total Payment</div>
              <div class="stat-value">
                ${formatMoney(campaign.total_payment)}
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">Task Reward</div>
              <div class="stat-value">
                ${formatMoney(campaign.task_reward)}
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">Platform</div>
              <div class="stat-value">
                ${escapeHtml(campaign.platform || "-")}
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">Task Type</div>
              <div class="stat-value">
                ${escapeHtml(campaign.task_type || "-")}
              </div>
            </div>

          </div>

          <div class="progress-wrap">

            <div class="progress-info">
              <span>Task Progress</span>
              <span>${completed} / ${capacity}</span>
            </div>

            <div class="progress">
              <div
                class="progress-bar"
                style="width:${progress}%"
              ></div>
            </div>

          </div>

          <div class="actions">

            <button
              class="details-btn"
              onclick="showDetails('${campaign.id}')"
            >
              View Details
            </button>

            ${
              status === "active"
              ? `
                <button
                  class="pause-btn"
                  onclick="changeCampaignStatus('${campaign.id}', 'paused')"
                >
                  Pause
                </button>
              `
              : status === "paused"
              ? `
                <button
                  class="activate-btn"
                  onclick="changeCampaignStatus('${campaign.id}', 'active')"
                >
                  Activate
                </button>
              `
              : ""
            }

          </div>

        </div>
      `;
    }).join("");
  }

  document
    .getElementById("searchInput")
    .addEventListener("input", function () {

      const query = this.value
        .trim()
        .toLowerCase();

      if (!query) {
        renderCampaigns(campaigns);
        return;
      }

      const filtered = campaigns.filter(campaign => {

        const title =
          String(campaign.title || "")
            .toLowerCase();

        const creator =
          String(campaign.creator_username || "")
            .toLowerCase();

        return (
          title.includes(query) ||
          creator.includes(query)
        );
      });

      renderCampaigns(filtered);
    });

  function showDetails(id) {

    const campaign = campaigns.find(
      item => item.id === id
    );

    if (!campaign) {
      return;
    }

    const targetUrl = campaign.target_url || "";

    document.getElementById("detailsContent").innerHTML = `

      <div class="detail-row">
        <div class="detail-label">Campaign Title</div>
        <div class="detail-value">
          ${escapeHtml(campaign.title)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Creator</div>
        <div class="detail-value">
          ${escapeHtml(campaign.creator_username || "Unknown")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Description</div>
        <div class="detail-value">
          ${escapeHtml(campaign.description || "-")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Platform</div>
        <div class="detail-value">
          ${escapeHtml(campaign.platform || "-")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Task Type</div>
        <div class="detail-value">
          ${escapeHtml(campaign.task_type || "-")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Campaign Type</div>
        <div class="detail-value">
          ${escapeHtml(campaign.campaign_type || "-")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Total Payment</div>
        <div class="detail-value">
          ${formatMoney(campaign.total_payment)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Task Budget</div>
        <div class="detail-value">
          ${formatMoney(campaign.task_budget)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Platform Revenue</div>
        <div class="detail-value">
          ${formatMoney(campaign.platform_revenue)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Task Reward</div>
        <div class="detail-value">
          ${formatMoney(campaign.task_reward)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Task Capacity</div>
        <div class="detail-value">
          ${escapeHtml(campaign.task_capacity)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Completed Tasks</div>
        <div class="detail-value">
          ${escapeHtml(campaign.completed_tasks)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Status</div>
        <div class="detail-value">
          ${escapeHtml(campaign.status || "-")}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Created</div>
        <div class="detail-value">
          ${formatDate(campaign.created_at)}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">Target URL</div>
        <div class="detail-value">
          ${
            targetUrl
            ? `<a
                class="url-link"
                href="${escapeHtml(targetUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >${escapeHtml(targetUrl)}</a>`
            : "-"
          }
        </div>
      </div>
    `;

    document
      .getElementById("detailsModal")
      .classList.add("show");
  }

  function closeDetails() {
    document
      .getElementById("detailsModal")
      .classList.remove("show");
  }

  document
    .getElementById("detailsModal")
    .addEventListener("click", function(event) {

      if (event.target === this) {
        closeDetails();
      }

    });

  async function changeCampaignStatus(
    campaignId,
    newStatus
  ) {

    const action =
      newStatus === "paused"
      ? "pause"
      : "activate";

    const confirmed = confirm(
      `Are you sure you want to ${action} this campaign?`
    );

    if (!confirmed) {
      return;
    }

    const {
      error
    } = await supabaseClient.rpc(
      "admin_set_campaign_status",
      {
        p_campaign_id: campaignId,
        p_status: newStatus
      }
    );

    if (error) {
      console.error(error);

      alert(
        "Failed to update campaign status."
      );

      return;
    }

    alert(
      `Campaign ${action}d successfully.`
    );

    await loadCampaigns();
  }

  loadCampaigns();
</script>

</body>
</html>
