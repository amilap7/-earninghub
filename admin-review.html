<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Admin Review</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
text-decoration:none;
color:#111
}

h1{
font-size:28px;
margin-bottom:8px
}

.subtitle{
color:#777;
font-size:14px;
margin-bottom:22px
}

.card{
border:1px solid #ddd;
border-radius:18px;
padding:18px;
margin-bottom:16px
}

.status{
font-size:12px;
color:#777;
margin-bottom:8px
}

.reward{
font-size:20px;
font-weight:800;
margin-top:10px
}

.proof{
margin-top:16px;
font-size:13px;
color:#555;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word
}

.screenshot{
display:block;
width:100%;
max-height:400px;
object-fit:contain;
margin-top:15px;
border:1px solid #ddd;
border-radius:12px;
background:#f5f5f5
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px
}

button{
border:0;
border-radius:11px;
padding:13px;
font-weight:bold;
cursor:pointer
}

.approve{
background:#111;
color:#fff
}

.reject{
background:#eee;
color:#111
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.message{
display:none;
margin-bottom:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}

.empty{
text-align:center;
padding:60px 20px;
color:#777;
line-height:1.5
}

.error{
padding:15px;
background:#f3f3f3;
border-radius:12px;
font-size:13px;
line-height:1.5;
word-break:break-word
}

.refresh{
width:100%;
background:#111;
color:#fff;
margin-bottom:15px
}

.meta{
font-size:12px;
color:#888;
margin-top:7px
}

.task-title{
font-size:16px;
font-weight:bold;
margin-top:6px;
line-height:1.4
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<a
class="back"
href="dashboard.html">
Back
</a>

</header>

<h1>
Task Review
</h1>

<p class="subtitle">
Review submitted task proofs.
</p>

<button
class="refresh"
id="refreshButton"
type="button"
onclick="loadSubmissions()">

Refresh Submissions

</button>

<div
id="message"
class="message">
</div>

<div id="submissions">

<div class="empty">
Loading submissions...
</div>

</div>

</div>

<script>

/*
================================================
SUPABASE
================================================
*/

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/*
================================================
HELPERS
================================================
*/

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showMessage(text){

const box =
document.getElementById("message");

box.textContent =
text;

box.style.display =
"block";

}


function hideMessage(){

const box =
document.getElementById("message");

box.textContent =
"";

box.style.display =
"none";

}


/*
================================================
ADMIN CHECK
================================================
*/

async function checkAdmin(){

const {
data:sessionData,
error:sessionError
} =
await client.auth.getSession();


if(sessionError){

showMessage(
"Session error: " +
sessionError.message
);

return false;

}


if(
!sessionData ||
!sessionData.session
){

showMessage(
"Please login first."
);

return false;

}


const userId =
sessionData.session.user.id;


const {
data:profile,
error:profileError
} =
await client
.from("profiles")
.select("is_admin")
.eq(
"id",
userId
)
.maybeSingle();


if(profileError){

showMessage(
"Admin check failed: " +
profileError.message
);

return false;

}


if(
!profile ||
profile.is_admin !== true
){

showMessage(
"Access denied. Admin access is required."
);

return false;

}


return true;

}


/*
================================================
PROOF DATA
================================================
*/

function getProofData(proof){

let details = "";
let screenshot = "";


if(!proof){

return {
details:"",
screenshot:""
};

}


try{

const parsed =
typeof proof === "string"
?
JSON.parse(proof)
:
proof;


if(
parsed &&
typeof parsed === "object"
){

details =
parsed.details || "";

screenshot =
parsed.screenshot || "";

}

}catch(error){

details =
String(proof);


/*
If old proof format contains
a base64 image, detect it.
*/

const imageMatch =
String(proof).match(
/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/
);


if(imageMatch){

screenshot =
imageMatch[0];

}

}


return {
details,
screenshot
};

}


/*
================================================
LOAD TASK INFORMATION
================================================
*/

async function loadTask(taskId){

if(!taskId){

return null;

}


const {
data,
error
} =
await client
.from("tasks")
.select(
"id,title,campaign_id"
)
.eq(
"id",
taskId
)
.maybeSingle();


if(error){

console.log(
"Task lookup error:",
error.message
);

return null;

}


return data || null;

}


/*
================================================
LOAD SUBMISSIONS
================================================
*/

async function loadSubmissions(){

hideMessage();


const refreshButton =
document.getElementById(
"refreshButton"
);

refreshButton.disabled =
true;

refreshButton.textContent =
"Loading...";


const box =
document.getElementById(
"submissions"
);


box.innerHTML = `

<div class="empty">
Loading submissions...
</div>

`;


/*
Check admin.
*/

const isAdmin =
await checkAdmin();


if(!isAdmin){

box.innerHTML = "";

refreshButton.disabled =
false;

refreshButton.textContent =
"Refresh Submissions";

return;

}


/*
Get pending submissions.
IMPORTANT:
Do NOT use an embedded tasks relation here.
*/

const {
data,
error
} =
await client
.from("task_submissions")
.select(
"id,task_id,worker_id,proof,status,reward,created_at"
)
.eq(
"status",
"pending"
)
.order(
"created_at",
{
ascending:false
}
);


if(error){

box.innerHTML = `

<div class="error">

<b>Database error</b>

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

refreshButton.disabled =
false;

refreshButton.textContent =
"Refresh Submissions";

return;

}


if(
!data ||
data.length === 0
){

box.innerHTML = `

<div class="empty">

<strong>
No pending submissions.
</strong>

<p style="margin-top:8px">
New task submissions will appear here.
</p>

</div>

`;

refreshButton.disabled =
false;

refreshButton.textContent =
"Refresh Submissions";

return;

}


/*
Load task information for each submission.
*/

const submissions =
await Promise.all(

data.map(
async function(submission){

const task =
await loadTask(
submission.task_id
);

return {
submission,
task
};

})

);


/*
Render.
*/

box.innerHTML =
submissions.map(
function(item){

const submission =
item.submission;

const task =
item.task;


const proofData =
getProofData(
submission.proof
);


const details =
proofData.details;

const screenshot =
proofData.screenshot;


const date =
submission.created_at
?
new Date(
submission.created_at
).toLocaleString()
:
"";


return `

<div
class="card"
id="submission-${escapeHTML(
submission.id
)}">

<div class="status">

Status: Pending

</div>


<div class="task-title">

${escapeHTML(
task?.title ||
"Task"
)}

</div>


<div class="meta">

Task ID:
${escapeHTML(
submission.task_id
)}

</div>


<div class="meta">

Worker ID:
${escapeHTML(
submission.worker_id
)}

</div>


<div class="reward">

Reward:
$${Number(
submission.reward || 0
).toFixed(2)}

</div>


<div class="meta">

Submitted:
${escapeHTML(
date
)}

</div>


<div class="proof">

<strong>
Proof details
</strong>

<br><br>

${escapeHTML(
details ||
"No proof details provided."
)}

</div>


${
screenshot
?
`

<img
class="screenshot"
src="${escapeHTML(
screenshot
)}"
alt="Task proof screenshot"
>

`
:
`

<div class="proof">

No screenshot uploaded.

</div>

`
}


<div class="buttons">

<button
class="approve"
type="button"
onclick="approveSubmission(
'${escapeHTML(
submission.id
)}'
)">

Approve

</button>


<button
class="reject"
type="button"
onclick="rejectSubmission(
'${escapeHTML(
submission.id
)}'
)">

Reject

</button>

</div>

</div>

`;

}
).join("");


refreshButton.disabled =
false;

refreshButton.textContent =
"Refresh Submissions";

}


/*
================================================
REMOVE CARD
================================================
*/

function removeSubmissionCard(
submissionId
){

const card =
document.getElementById(
"submission-" +
submissionId
);


if(card){

card.remove();

}


const remaining =
document.querySelectorAll(
"#submissions .card"
).length;


if(remaining === 0){

document.getElementById(
"submissions"
).innerHTML = `

<div class="empty">

<strong>
No pending submissions.
</strong>

<p style="margin-top:8px">
All pending submissions have been reviewed.
</p>

</div>

`;

}

}


/*
================================================
APPROVE
================================================
*/

async function approveSubmission(
submissionId
){

const card =
document.getElementById(
"submission-" +
submissionId
);


if(!card){

return;

}


const buttons =
card.querySelectorAll(
"button"
);


buttons.forEach(
function(button){

button.disabled =
true;

});


buttons[0].textContent =
"Approving...";


const {
data,
error
} =
await client.rpc(
"approve_task_submission",
{
submission_id:
submissionId
}
);


if(error){

buttons.forEach(
function(button){

button.disabled =
false;

});

buttons[0].textContent =
"Approve";


alert(
"Approve failed:\n\n" +
error.message
);

return;

}


/*
RPC returns boolean true.
*/

if(data === true){

removeSubmissionCard(
submissionId
);

alert(
"Task approved successfully. Reward added to wallet."
);

return;

}


/*
Some Supabase configurations may
return null after successful RPC.
*/

if(data === null){

removeSubmissionCard(
submissionId
);

return;

}


buttons.forEach(
function(button){

button.disabled =
false;

});

buttons[0].textContent =
"Approve";


alert(
"Unable to approve submission."
);

}


/*
================================================
REJECT
================================================
*/

async function rejectSubmission(
submissionId
){

const confirmed =
confirm(
"Reject this task submission?"
);


if(!confirmed){

return;

}


const card =
document.getElementById(
"submission-" +
submissionId
);


if(!card){

return;

}


const buttons =
card.querySelectorAll(
"button"
);


buttons.forEach(
function(button){

button.disabled =
true;

});


buttons[1].textContent =
"Rejecting...";


const {
data,
error
} =
await client.rpc(
"reject_task_submission",
{
submission_id:
submissionId
}
);


if(error){

buttons.forEach(
function(button){

button.disabled =
false;

});

buttons[1].textContent =
"Reject";


alert(
"Reject failed:\n\n" +
error.message
);

return;

}


if(
data === true ||
data === null
){

removeSubmissionCard(
submissionId
);

alert(
"Task rejected successfully."
);

return;

}


buttons.forEach(
function(button){

button.disabled =
false;

});

buttons[1].textContent =
"Reject";


alert(
"Unable to reject submission."
);

}


/*
================================================
START
================================================
*/

loadSubmissions();

</script>

</body>
</html>
