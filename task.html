<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Task</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold
}

.card{
border:1px solid #ddd;
border-radius:20px;
padding:20px
}

.platform{
font-size:12px;
color:#777;
margin-bottom:8px
}

h1{
font-size:27px;
margin-bottom:12px
}

.description{
font-size:14px;
color:#666;
line-height:1.6
}

.reward{
background:#111;
color:#fff;
border-radius:14px;
padding:18px;
margin-top:20px
}

.reward small{
color:#bbb
}

.reward strong{
display:block;
font-size:30px;
margin-top:5px
}

.info{
margin-top:18px
}

.info p{
font-size:13px;
color:#666;
margin-top:7px
}

.target{
display:block;
width:100%;
text-align:center;
text-decoration:none;
background:#111;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:20px
}

.proof{
border-top:1px solid #ddd;
margin-top:22px;
padding-top:20px
}

.proof h2{
font-size:19px;
margin-bottom:8px
}

.proof p{
font-size:13px;
color:#777;
line-height:1.5;
margin-bottom:12px
}

textarea{
width:100%;
min-height:110px;
padding:13px;
border:1px solid #ccc;
border-radius:12px;
outline:none;
resize:vertical
}

.submit{
width:100%;
border:0;
background:#111;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:12px
}

.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}

.empty{
text-align:center;
padding:60px 20px;
color:#777
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<button
class="back"
onclick="window.location.href='tasks.html'">

Back

</button>

</header>

<div id="content">

<div class="empty">
Loading task...
</div>

</div>

</div>


<script>

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
Get campaign from URL.
*/

const params =
new URLSearchParams(
window.location.search
);

const encoded =
params.get("campaign");


if(!encoded){

document.getElementById("content").innerHTML=`

<div class="empty">

<h3>Task not found</h3>

<p style="margin-top:10px">
Please go back and select a task again.
</p>

</div>

`;

}else{

try{

const campaign =
JSON.parse(
decodeURIComponent(encoded)
);


document.getElementById("content").innerHTML=`

<div class="card">

<div class="platform">

${escapeHTML(campaign.platform)}

</div>


<h1>

${escapeHTML(campaign.title)}

</h1>


<div class="description">

${escapeHTML(campaign.description)}

</div>


<div class="reward">

<small>
Reward
</small>

<strong>
$${Number(campaign.reward || 0).toFixed(2)}
</strong>

</div>


<div class="info">

<strong>
Task type
</strong>

<p>
${escapeHTML(campaign.task_type)}
</p>

</div>


<a
class="target"
href="${escapeHTML(campaign.target_url)}"
target="_blank"
rel="noopener noreferrer">

Open Target

</a>


<div class="proof">

<h2>
Submit Proof
</h2>

<p>
Complete the task using the target link above,
then enter your proof below.
</p>


<textarea
id="proof"
placeholder="Enter proof details or proof link...">
</textarea>


<button
class="submit"
onclick="submitProof()">

Submit Task

</button>


<div
id="message"
class="message">
</div>

</div>

</div>

`;

window.selectedCampaign =
campaign;


}catch(error){

document.getElementById("content").innerHTML=`

<div class="empty">

<h3>Unable to open task</h3>

<p style="margin-top:10px">
Please return to Tasks and try again.
</p>

</div>

`;

}

}


async function submitProof(){

const message =
document.getElementById("message");

const proof =
document.getElementById("proof").value.trim();


if(!proof){

message.textContent =
"Please enter your proof first.";

message.style.display="block";

return;

}


/*
Supabase connection is only needed
when submitting the proof.
*/

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const {
data,
error
} =
await client.auth.getUser();


if(error || !data.user){

message.textContent =
"Please login before submitting your task.";

message.style.display="block";

return;

}


const {
error:insertError
} =
await client
.from("task_submissions")
.insert({

task_id:
window.selectedCampaign.id,

worker_id:
data.user.id,

proof:proof,

status:"pending",

reward:
Number(
window.selectedCampaign.reward || 0
)

});


if(insertError){

message.textContent =
insertError.message;

message.style.display="block";

return;

}


message.textContent =
"Task submitted successfully. It is now pending review.";

message.style.display="block";

document.getElementById("proof").value="";

}

</script>

</body>
</html>
