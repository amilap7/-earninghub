<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Task</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
text-decoration:none;
color:#111
}

.card{
border:1px solid #ddd;
border-radius:20px;
padding:20px
}

.platform{
font-size:12px;
color:#777;
margin-bottom:8px
}

h1{
font-size:27px;
margin-bottom:12px
}

.description{
font-size:14px;
color:#666;
line-height:1.6
}

.reward{
background:#111;
color:#fff;
border-radius:14px;
padding:18px;
margin-top:20px
}

.reward small{
color:#bbb
}

.reward strong{
display:block;
font-size:30px;
margin-top:5px
}

.info{
margin-top:18px
}

.info p{
font-size:13px;
color:#666;
margin-top:7px
}

.target{
display:block;
width:100%;
text-align:center;
text-decoration:none;
background:#111;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:20px
}

.proof{
border-top:1px solid #ddd;
margin-top:22px;
padding-top:20px
}

.proof h2{
font-size:19px;
margin-bottom:8px
}

.proof p{
font-size:13px;
color:#777;
line-height:1.5;
margin-bottom:12px
}

textarea{
display:block;
width:100%;
min-height:110px;
padding:13px;
border:1px solid #bbb;
border-radius:12px;
outline:none;
resize:vertical;
background:#fff;
color:#111;
font-size:14px
}

.submit{
display:block;
width:100%;
border:0;
background:#111;
color:#fff;
padding:15px;
border-radius:11px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
font-size:15px
}

.submit:disabled{
opacity:.5
}

.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}

.empty{
text-align:center;
padding:60px 20px;
color:#777
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<a
class="back"
href="earn-tasks2.html">
Back
</a>

</header>

<div id="content">

<div class="empty">
Loading task...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


const params =
new URLSearchParams(
window.location.search
);

const encoded =
params.get("campaign");


let selectedCampaign = null;


if(!encoded){

document.getElementById("content").innerHTML=`

<div class="empty">

<h3>Task not found</h3>

<p style="margin-top:10px">
Please go back and select a task again.
</p>

</div>

`;

}else{

try{

selectedCampaign =
JSON.parse(
decodeURIComponent(encoded)
);


document.getElementById("content").innerHTML=`

<div class="card">

<div class="platform">
${escapeHTML(selectedCampaign.platform)}
</div>

<h1>
${escapeHTML(selectedCampaign.title)}
</h1>

<div class="description">
${escapeHTML(selectedCampaign.description)}
</div>

<div class="reward">

<small>
Reward
</small>

<strong>
$${Number(
selectedCampaign.reward || 0
).toFixed(2)}
</strong>

</div>

<div class="info">

<strong>
Task type
</strong>

<p>
${escapeHTML(selectedCampaign.task_type)}
</p>

</div>

<a
class="target"
href="${escapeHTML(selectedCampaign.target_url)}"
target="_blank"
rel="noopener noreferrer">

Open Target

</a>


<div class="proof">

<h2>
Submit Proof
</h2>

<p>
Complete the task first, then enter your proof below.
</p>

<form id="proofForm">

<textarea
id="proof"
name="proof"
placeholder="Enter proof details or proof link..."
required></textarea>

<button
type="submit"
class="submit">

Submit Task

</button>

</form>

<div
id="message"
class="message">
</div>

</div>

</div>

`;


document
.getElementById("proofForm")
.addEventListener(
"submit",
submitProof
);


}catch(error){

document.getElementById("content").innerHTML=`

<div class="empty">

<h3>Unable to open task</h3>

<p style="margin-top:10px">
Please return to Tasks and try again.
</p>

</div>

`;

}

}


async function submitProof(event){

event.preventDefault();


const message =
document.getElementById("message");

const button =
document.querySelector(".submit");

const proof =
document.getElementById("proof")
.value
.trim();


if(!proof){

message.textContent =
"Please enter your proof first.";

message.style.display="block";

return;

}


button.disabled=true;

button.textContent="Submitting...";


/*
Get the currently logged-in session.
*/

const {
data:sessionData,
error:sessionError
} =
await client.auth.getSession();


if(sessionError){

message.textContent =
"Session error: " +
sessionError.message;

message.style.display="block";

button.disabled=false;

button.textContent="Submit Task";

return;

}


const session =
sessionData.session;


if(!session){

message.textContent =
"Please login before submitting your task.";

message.style.display="block";

button.disabled=false;

button.textContent="Submit Task";

return;

}


const workerId =
session.user.id;


/*
Insert task submission.
*/

const {
error:insertError
} =
await client
.from("task_submissions")
.insert({

task_id:
selectedCampaign.id,

worker_id:
workerId,

proof:
proof,

status:
"pending",

reward:
Number(
selectedCampaign.reward || 0
)

});


if(insertError){

message.textContent =
"Submit error: " +
insertError.message;

message.style.display="block";

button.disabled=false;

button.textContent="Submit Task";

return;

}


message.textContent =
"Task submitted successfully! Your submission is pending review.";

message.style.display="block";

document
.getElementById("proofForm")
.reset();

button.disabled=false;

button.textContent="Submit Task";

}

</script>

</body>
</html>
