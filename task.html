<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Task</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

:root{
--bg:#08111f;
--panel:#111e30;
--panel2:#16263b;
--gold:#f5c542;
--text:#ffffff;
--muted:#a8b4c6;
--border:#26364b;
}

body{
background:var(--bg);
color:var(--text);
padding-bottom:105px;
min-height:100vh;
}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
padding:20px 18px 30px;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px;
gap:12px;
}

.logo{
font-size:24px;
font-weight:800;
color:var(--gold);
}

.back{
border:1px solid var(--border);
background:var(--panel);
border-radius:10px;
padding:10px 14px;
font-size:13px;
font-weight:bold;
text-decoration:none;
color:var(--text);
}

/* TASK CARD */

.card{
background:var(--panel);
border:1px solid var(--border);
border-radius:18px;
padding:20px;
}

.platform{
font-size:12px;
font-weight:bold;
color:var(--gold);
margin-bottom:9px;
text-transform:uppercase;
letter-spacing:.6px;
}

h1{
font-size:26px;
line-height:1.3;
margin-bottom:12px;
overflow-wrap:anywhere;
}

.description{
font-size:14px;
color:var(--muted);
line-height:1.7;
overflow-wrap:anywhere;
}

/* REWARD */

.reward{
background:var(--panel2);
border:1px solid #35455b;
border-radius:13px;
padding:17px;
margin-top:19px;
}

.reward small{
color:var(--muted);
font-size:12px;
}

.reward strong{
display:block;
font-size:29px;
color:var(--gold);
margin-top:5px;
}

/* TASK DETAILS */

.info{
margin-top:19px;
}

.info strong{
font-size:14px;
}

.info p{
font-size:13px;
color:var(--muted);
margin-top:7px;
line-height:1.6;
}

.target{
display:block;
width:100%;
text-align:center;
text-decoration:none;
background:var(--gold);
color:#111827;
padding:14px;
border-radius:11px;
font-weight:800;
margin-top:20px;
font-size:14px;
}

.target:active,
.submit:active{
transform:scale(.99);
}

/* PROOF FORM */

.proof{
border-top:1px solid var(--border);
margin-top:23px;
padding-top:21px;
}

.proof h2{
font-size:19px;
margin-bottom:8px;
}

.proof p{
font-size:13px;
color:var(--muted);
line-height:1.6;
margin-bottom:16px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:8px;
}

textarea{
display:block;
width:100%;
min-height:105px;
padding:13px;
border:1px solid var(--border);
border-radius:11px;
outline:none;
resize:vertical;
background:#0b1728;
color:var(--text);
font-size:14px;
margin-top:12px;
}

textarea::placeholder{
color:#8290a4;
}

input[type="file"]{
display:block;
width:100%;
padding:12px;
border:1px solid var(--border);
border-radius:11px;
background:#0b1728;
color:var(--muted);
font-size:12px;
margin-bottom:12px;
}

.submit{
display:block;
width:100%;
border:0;
background:var(--gold);
color:#111827;
padding:15px;
border-radius:11px;
font-weight:800;
margin-top:13px;
cursor:pointer;
font-size:14px;
}

.submit:disabled{
opacity:.55;
cursor:not-allowed;
}

.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:11px;
background:#17283a;
border:1px solid #35465a;
color:#e2eaf4;
font-size:13px;
line-height:1.6;
overflow-wrap:anywhere;
}

.empty{
text-align:center;
padding:45px 20px;
color:var(--muted);
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
line-height:1.7;
}

.empty h3{
color:var(--text);
font-size:19px;
margin-bottom:8px;
}

/* BOTTOM NAVIGATION */

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
width:100%;
min-height:72px;
display:flex;
align-items:center;
justify-content:space-around;
padding:7px 3px calc(7px + env(safe-area-inset-bottom));
background:#0c1727;
border-top:1px solid var(--border);
box-shadow:0 -4px 18px rgba(0,0,0,.25);
z-index:9999;
}

.bottom-nav a{
flex:1;
min-width:0;
min-height:50px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
color:#94a3b8;
text-decoration:none;
font-size:10px;
font-weight:600;
white-space:nowrap;
}

.bottom-nav a svg{
width:22px;
height:22px;
stroke:currentColor;
stroke-width:1.8;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
}

.bottom-nav a.active{
color:var(--gold);
font-weight:800;
}

.bottom-nav a.earn-link{
color:var(--gold);
font-weight:800;
}

.bottom-nav a.earn-link .earn-icon-wrap{
width:44px;
height:44px;
flex-shrink:0;
border-radius:50%;
background:#263044;
display:flex;
align-items:center;
justify-content:center;
margin-top:-17px;
border:2px solid var(--gold);
}

.bottom-nav a.earn-link svg{
width:26px;
height:26px;
stroke:var(--gold);
stroke-width:2.4;
}

.bottom-nav a.earn-link span{
color:var(--gold);
font-size:11px;
font-weight:800;
}

@media(max-width:380px){
.app{
padding-left:13px;
padding-right:13px;
}

h1{
font-size:23px;
}

.card{
padding:16px;
}

.bottom-nav a{
font-size:9px;
gap:3px;
}

.bottom-nav a.earn-link .earn-icon-wrap{
width:40px;
height:40px;
margin-top:-14px;
}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">EarningHub</div>
<a class="back" href="earn-tasks2.html">← Back</a>
</header>

<div id="content">
<div class="empty">Loading task...</div>
</div>

</div>

<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav" aria-label="Main navigation">

<a href="dashboard.html">
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M3 10.5 12 3l9 7.5"></path>
<path d="M5.5 9.5V21h13V9.5"></path>
<path d="M9 21v-7h6v7"></path>
</svg>
<span>Home</span>
</a>

<a href="create-campaign.html">
<svg viewBox="0 0 24 24" aria-hidden="true">

<path d="M4 7h-1a2 2 0 0 0 0 6h1"></path>
<path d="m8 17 2 4h4l-3-5"></path>
<path d="M19 8h2"></path>
<path d="M19 12h2"></path>
</svg>
<span>Campaigns</span>
</a>

<a href="earn.html" class="earn-link active" aria-current="page">
<div class="earn-icon-wrap">
<svg viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="12" r="9"></circle>

</svg>
</div>
<span>Earn</span>

<a href="wallet.html">
<svg viewBox="0 0 24 24" aria-hidden="true">
<rect x="2.5" y="5" width="19" height="15" rx="2.5"></rect>
<path d="M3 9h18"></path>

</svg>
<span>Wallet</span>
</a>

<a href="account.html">
<svg viewBox="0 0 24 24" aria-hidden="true">
<circle cx="12" cy="8" r="4"></circle>
<path d="M4 21a8 8 0 0 1 16 0"></path>
</svg>
<span>Account</span>
</a>

</nav>

<script>
const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function escapeHTML(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

const params = new URLSearchParams(window.location.search);
const campaignParam = params.get("campaign");

let selectedCampaign = null;

function showEmpty(title,text){
document.getElementById("content").innerHTML = `
<div class="empty">
<h3>${escapeHTML(title)}</h3>
<p>${escapeHTML(text)}</p>
</div>`;
}

function getCampaignId(value){
try{
const parsed = JSON.parse(decodeURIComponent(value));
if(parsed && parsed.id) return parsed.id;
}catch(e){}

/* Also support a direct campaign ID in the query string. */
return value;
}

async function checkDailyLimit(){
const {data:sessionData,error:sessionError} =
await client.auth.getSession();

if(sessionError){
showEmpty("Session error",sessionError.message);
return;
}

if(!sessionData.session){
renderTask();
return;
}

const workerId = sessionData.session.user.id;

const {data:task,error:taskError} = await client
.from("tasks")
.select("id")
.eq("campaign_id",selectedCampaign.id)
.maybeSingle();

if(taskError){
showEmpty("Unable to check task",taskError.message);
return;
}

if(task){
const {data:existingSubmission,error:submissionError} = await client
.from("task_submissions")
.select("status")
.eq("worker_id",workerId)
.eq("task_id",task.id)
.maybeSingle();

if(submissionError){
showEmpty("Unable to check task status",submissionError.message);
return;
}

if(existingSubmission){
if(existingSubmission.status === "rejected"){
showEmpty(
"Task Rejected",
"Your previous submission was rejected. Please contact support or follow the campaign rules before trying again."
);
return;
}

if(existingSubmission.status === "approved"){
showEmpty(
"Task Already Completed",
"You have already completed this task."
);
return;
}

showEmpty(
"Submission Pending",
"Your screenshot has already been submitted and is waiting for admin review."
);
return;
}
}

const today = new Date();
today.setHours(0,0,0,0);

const tomorrow = new Date(today);
tomorrow.setDate(tomorrow.getDate()+1);

const {count,error} = await client
.from("task_submissions")
.select("id",{count:"exact",head:true})
.eq("worker_id",workerId)
.gte("created_at",today.toISOString())
.lt("created_at",tomorrow.toISOString());

if(error){
showEmpty("Unable to check today's tasks",error.message);
return;
}

if((count || 0) >= 20){
showEmpty(
"Daily task limit reached",
"You have reached today's submission limit. Please come back tomorrow."
);
return;
}

renderTask();
}

function renderTask(){
const taskTypeNames = {
youtube_subscribe:"YouTube Subscribe",
video_watch:"Watch Video",
content_discovery:"Discover Content",
feedback:"Provide Feedback",
website_visit:"Website Visit",
survey:"Complete Survey",
facebook_follow:"Facebook Follow",
instagram_follow:"Instagram Follow",
tiktok_follow:"TikTok Follow"
};

const rawType = String(selectedCampaign.task_type || "");
const taskType = taskTypeNames[rawType] ||
rawType.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());

const target = String(selectedCampaign.target_url || "");

let safeTarget = "#";
try{
const parsedURL = new URL(target);
if(parsedURL.protocol === "https:" || parsedURL.protocol === "http:"){
safeTarget = parsedURL.href;
}
}catch(e){}

document.getElementById("content").innerHTML = `
<div class="card">

<div class="platform">
${escapeHTML(selectedCampaign.platform || "Campaign")}
</div>

<h1>${escapeHTML(selectedCampaign.title || "Campaign Task")}</h1>

<div class="description">
${escapeHTML(selectedCampaign.description || "Follow the instructions and submit proof of your completed task.")}
</div>

<div class="reward">
<small>Task Reward</small>
<strong>$${Number(selectedCampaign.reward || 0).toFixed(2)}</strong>
</div>

<div class="info">
<strong>Task Type</strong>
<p>${escapeHTML(taskType)}</p>
</div>

<a class="target"
href="${escapeHTML(safeTarget)}"
target="_blank"
rel="noopener noreferrer">
Open Target Website →
</a>

<div class="proof">
<h2>Submit Proof</h2>
<p>Complete the requested activity, then upload a screenshot and describe your proof. Your submission will be reviewed by an admin.</p>

<form id="proofForm">
<label for="screenshot">Screenshot</label>
<input
id="screenshot"
type="file"
accept="image/png,image/jpeg,image/jpg"
required>

<label for="proof">Proof Details</label>
<textarea
id="proof"
name="proof"
placeholder="Describe what you completed or enter your proof link..."
required></textarea>

<button type="submit" class="submit">Submit Task</button>
</form>

<div id="message" class="message" role="status"></div>
</div>

</div>`;

document.getElementById("proofForm").addEventListener("submit",submitProof);
}

async function submitProof(event){
event.preventDefault();

const message = document.getElementById("message");
const button = document.querySelector(".submit");
const proof = document.getElementById("proof").value.trim();
const screenshot = document.getElementById("screenshot").files[0];

message.style.display = "block";

if(!screenshot){
message.textContent = "Please upload a screenshot first.";
return;
}

if(!proof){
message.textContent = "Please enter your proof details.";
return;
}

if(!screenshot.type.startsWith("image/")){
message.textContent = "Please upload a valid image screenshot.";
return;
}

/* Avoid oversized data-URL submissions. */
if(screenshot.size > 2 * 1024 * 1024){
message.textContent = "Please choose a screenshot smaller than 2 MB.";
return;
}

button.disabled = true;
button.textContent = "Submitting...";
message.textContent = "Submitting your task...";

const {data:sessionData,error:sessionError} = await client.auth.getSession();

if(sessionError){
showError(message,"Session error: " + sessionError.message,button);
return;
}

if(!sessionData.session){
showError(message,"Please log in before submitting your task.",button);
return;
}

const workerId = sessionData.session.user.id;

const today = new Date();
today.setHours(0,0,0,0);

const tomorrow = new Date(today);
tomorrow.setDate(tomorrow.getDate()+1);

const {count:todayCount,error:countError} = await client
.from("task_submissions")
.select("id",{count:"exact",head:true})
.eq("worker_id",workerId)
.gte("created_at",today.toISOString())
.lt("created_at",tomorrow.toISOString());

if(countError){
showError(message,"Unable to check daily task limit: " + countError.message,button);
return;
}

if((todayCount || 0) >= 20){
showError(message,"You have reached today's submission limit. Please come back tomorrow.",button);
return;
}

const {data:task,error:taskError} = await client
.from("tasks")
.select("id")
.eq("campaign_id",selectedCampaign.id)
.maybeSingle();

if(taskError){
showError(message,"Task lookup error: " + taskError.message,button);
return;
}

if(!task){
showError(
message,
"This campaign does not have a matching record in the tasks table. Please contact the site administrator.",
button
);
return;
}

/* Check for an existing submission before inserting. */
const {data:existing,error:existingError} = await client
.from("task_submissions")
.select("id,status")
.eq("worker_id",workerId)
.eq("task_id",task.id)
.maybeSingle();

if(existingError){
showError(message,"Unable to check existing submission: " + existingError.message,button);
return;
}

if(existing){
showError(
message,
"Your submission already exists with status: " + existing.status + ".",
button
);
return;
}

let screenshotData;

try{
screenshotData = await fileToDataURL(screenshot);
}catch(error){
showError(message,"Unable to read the screenshot.",button);
return;
}

const finalProof = JSON.stringify({
details:proof,
screenshot:screenshotData
});

const {error:insertError} = await client
.from("task_submissions")
.insert({
task_id:task.id,
worker_id:workerId,
proof:finalProof,
status:"pending",
reward:Number(selectedCampaign.reward || 0)
});

if(insertError){
showError(message,"Submit error: " + insertError.message,button);
return;
}

message.textContent = "Task submitted successfully! Your screenshot is pending review.";
message.style.display = "block";

document.getElementById("proofForm").reset();
button.disabled = true;
button.textContent = "Submitted — Pending Review";
}

function fileToDataURL(file){
return new Promise(function(resolve,reject){
const reader = new FileReader();
reader.onload = function(){resolve(reader.result);};
reader.onerror = function(){reject(reader.error);};
reader.readAsDataURL(file);
});
}

function showError(message,text,button){
message.textContent = text;
message.style.display = "block";
button.disabled = false;
button.textContent = "Submit Task";
}

async function loadSelectedCampaign(){
if(!campaignParam){
showEmpty("Task not found","Please return to Available Tasks and select a campaign again.");
return;
}

/*
Support both a direct campaign ID and the JSON campaign
parameter format used by the previous task list.
*/

let campaignId = campaignParam;

try{
const decoded = decodeURIComponent(campaignParam);
const parsed = JSON.parse(decoded);
if(parsed && parsed.id){
campaignId = parsed.id;
}
}catch(e){
campaignId = getCampaignId(campaignParam);
}

const {data,error} = await client
.from("campaigns")
.select("id,title,description,platform,task_type,target_url,reward,budget,status")
.eq("id",campaignId)
.maybeSingle();

if(error){
showEmpty("Unable to load campaign",error.message);
return;
}

if(!data){
showEmpty("Campaign not found","This campaign may have been removed. Please return to Available Tasks.");
return;
}

if(data.status !== "active"){
showEmpty("Campaign unavailable","This campaign is not currently active.");
return;
}

selectedCampaign = data;
await checkDailyLimit();
}

loadSelectedCampaign();
</script>

</body>
</html>
