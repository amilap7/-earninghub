<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Task</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#fff;
color:#111;
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px;
}

.logo{
font-size:24px;
font-weight:800;
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
}

.card{
border:1px solid #ddd;
border-radius:20px;
padding:20px;
}

.platform{
font-size:12px;
color:#777;
margin-bottom:8px;
}

h1{
font-size:26px;
margin-bottom:12px;
}

.description{
color:#666;
font-size:14px;
line-height:1.6;
}

.reward{
margin-top:20px;
padding:18px;
border-radius:14px;
background:#111;
color:#fff;
}

.reward small{
color:#bbb;
}

.reward strong{
display:block;
font-size:30px;
margin-top:5px;
}

.info{
margin-top:18px;
}

.info p{
font-size:13px;
color:#666;
margin-top:8px;
}

.visit{
display:block;
text-align:center;
text-decoration:none;
background:#111;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:20px;
}

.proof{
margin-top:20px;
border-top:1px solid #ddd;
padding-top:20px;
}

.proof h2{
font-size:18px;
margin-bottom:8px;
}

.proof p{
font-size:13px;
color:#777;
line-height:1.5;
margin-bottom:12px;
}

textarea{
width:100%;
min-height:100px;
padding:13px;
border:1px solid #ccc;
border-radius:12px;
resize:vertical;
outline:none;
}

.submit{
width:100%;
border:0;
background:#111;
color:#fff;
padding:14px;
border-radius:11px;
font-weight:bold;
margin-top:12px;
}

.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5;
}

.loading{
text-align:center;
padding:60px 20px;
color:#777;
}

.ad{
margin-top:20px;
border:1px dashed #aaa;
border-radius:14px;
padding:20px;
text-align:center;
color:#777;
font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<button
class="back"
onclick="history.back()">
Back
</button>

</header>

<div id="content">

<div class="loading">
Loading task...
</div>

</div>

</div>


<script>

let campaign = null;


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function loadTask(){

const saved =
localStorage.getItem(
"earninghub_selected_campaign"
);


if(!saved){

document.getElementById("content").innerHTML = `

<div class="loading">

<h3>Task not found</h3>

<p style="margin-top:10px">
Please return to the Tasks page and select a task again.
</p>

</div>

`;

return;

}


try{

campaign =
JSON.parse(saved);

}catch(error){

document.getElementById("content").innerHTML = `

<div class="loading">
Unable to load this task.
</div>

`;

return;

}


document.getElementById("content").innerHTML = `

<div class="card">

<div class="platform">
${escapeHTML(campaign.platform)}
</div>

<h1>
${escapeHTML(campaign.title)}
</h1>

<div class="description">
${escapeHTML(campaign.description)}
</div>

<div class="reward">

<small>
Reward
</small>

<strong>
$${Number(campaign.reward || 0).toFixed(2)}
</strong>

</div>

<div class="info">

<strong>
Task type
</strong>

<p>
${escapeHTML(campaign.task_type)}
</p>

</div>


<a
class="visit"
href="${escapeHTML(campaign.target_url)}"
target="_blank"
rel="noopener noreferrer">

Open Target

</a>


<div class="proof">

<h2>
Submit Proof
</h2>

<p>
After completing the campaign task, submit a short
description or proof link for review.
</p>

<textarea
id="proof"
placeholder="Enter your proof or details here..."
></textarea>

<button
class="submit"
onclick="submitProof()">

Submit Task

</button>

<div
id="message"
class="message">
</div>

</div>

</div>


<div class="ad">
Advertisement
</div>

`;

}


async function submitProof(){

const proof =
document.getElementById("proof").value.trim();

const message =
document.getElementById("message");


if(!proof){

message.textContent =
"Please enter your proof before submitting.";

message.style.display="block";

return;

}


/*
Authentication is checked here.
*/

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const {
data,
error
} =
await client.auth.getUser();


if(error || !data.user){

message.textContent =
"Please login before submitting a task.";

message.style.display="block";

return;

}


/*
Create the task submission.
*/

const {
error:insertError
} =
await client
.from("task_submissions")
.insert({

task_id:campaign.id,

worker_id:data.user.id,

proof:proof,

status:"pending",

reward:Number(campaign.reward || 0)

});


if(insertError){

message.textContent =
insertError.message;

message.style.display="block";

return;

}


message.textContent =
"Task submitted successfully. Your submission is pending review.";

message.style.display="block";

document.getElementById("proof").value="";

}


loadTask();

</script>

</body>
</html>
