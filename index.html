<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EarningHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}
body{
background:#fff;
color:#111
}
.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:24px 20px
}
.logo{
font-size:30px;
font-weight:800;
margin:15px 0 45px
}
.hero h1{
font-size:34px;
line-height:1.1;
margin-bottom:12px
}
.hero p{
color:#777;
font-size:14px;
line-height:1.5;
margin-bottom:28px
}
.tabs{
display:grid;
grid-template-columns:1fr 1fr;
border:1px solid #ddd;
border-radius:12px;
padding:4px;
margin-bottom:20px
}
.tab{
border:0;
background:#fff;
padding:12px;
border-radius:9px;
font-weight:bold
}
.tab.active{
background:#111;
color:#fff
}
.form{
display:none
}
.form.active{
display:block
}
.group{
margin-bottom:15px
}
label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px
}
input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:12px;
outline:none;
background:#fff;
color:#111
}
.button{
width:100%;
border:0;
background:#111;
color:#fff;
padding:15px;
border-radius:12px;
font-weight:bold;
margin-top:5px
}
.button:disabled{
opacity:.5
}
.message{
display:none;
margin-top:15px;
padding:13px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}
.ad{
margin-top:30px;
border:1px dashed #aaa;
border-radius:14px;
padding:20px;
text-align:center;
font-size:13px;
color:#777
}
</style>
</head>
<body>
<div class="app">
<div class="logo">
EarningHub
</div>
<div class="hero">
<h1>
Earn by completing tasks.
</h1>
<p>
Complete legitimate campaigns, discover content,
and earn rewards through EarningHub.
</p>
</div>
<div class="tabs">
<button
class="tab active"
id="loginTab"
onclick="showForm('login')">
Login
</button>
<button
class="tab"
id="signupTab"
onclick="showForm('signup')">
Sign Up
</button>
</div>
<!-- LOGIN -->
<form
id="loginForm"
class="form active">
<div class="group">
<label>
Email
</label>
<input
id="loginEmail"
type="email"
placeholder="you@example.com"
required>
</div>
<div class="group">
<label>
Password
</label>
<input
id="loginPassword"
type="password"
placeholder="Your password"
required>
</div>
<button
class="button"
id="loginButton"
type="submit">
Login
</button>
</form>
<!-- SIGNUP -->
<form
id="signupForm"
class="form">
<div class="group">
<label>
Username
</label>
<input
id="signupUsername"
type="text"
placeholder="Your username"
required
maxlength="30">
</div>
<div class="group">
<label>
Email
</label>
<input
id="signupEmail"
type="email"
placeholder="you@example.com"
required>
</div>
<div class="group">
<label>
Password
</label>
<input
id="signupPassword"
type="password"
placeholder="At least 6 characters"
minlength="6"
required>
</div>
<button
class="button"
id="signupButton"
type="submit">
Create Account
</button>
</form>
<div
id="message"
class="message">
</div>
<div class="ad">
Advertisement
</div>
</div>
<script>
const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";
const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";
const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
/*
================================================
REFERRAL
================================================
*/
/*
Referral code coming from:
https://earninghub.pages.dev/referral.html?ref=EHXXXXXXXX
or
https://earninghub.pages.dev/index.html?ref=EHXXXXXXXX
*/
let referralCode =
null;
/*
Read referral code from URL
*/
function getReferralCodeFromUrl(){
const params =
new URLSearchParams(
window.location.search
);
const ref =
params.get("ref");
if(!ref){
return null;
}
const cleanCode =
ref
.trim()
.toUpperCase();
if(!cleanCode){
return null;
}
/*
Referral codes start with EH.
*/
if(
!cleanCode.startsWith("EH")
){
return null;
}
return cleanCode;
}
/*
Save referral code locally.
This keeps the referral code while
the user logs in.
*/
function saveReferralCode(code){
if(!code){
return;
}
try{
localStorage.setItem(
"earninghub_referral_code",
code
);
}catch(error){
console.log(
"Unable to save referral code."
);
}
}
/*
Load saved referral code.
*/
function loadSavedReferralCode(){
try{
return localStorage.getItem(
"earninghub_referral_code"
);
}catch(error){
return null;
}
}
/*
Remove referral code.
This is handled later by referral.html
after successful Apply.
*/
function clearReferralCode(){
try{
localStorage.removeItem(
"earninghub_referral_code"
);
}catch(error){
}
}
/*
Initialize referral.
IMPORTANT:
Referral link ALWAYS opens LOGIN.
It does NOT open Signup.
*/
function initializeReferral(){
const urlCode =
getReferralCodeFromUrl();
if(urlCode){
referralCode =
urlCode;
saveReferralCode(
urlCode
);
/*
Keep Login form active.
*/
showForm("login");
return;
}
/*
If no URL code exists,
check saved referral code.
*/
const savedCode =
loadSavedReferralCode();
if(savedCode){
referralCode =
savedCode;
}
}
/*
================================================
MESSAGE
================================================
*/
function showMessage(text){
const box =
document.getElementById("message");
box.textContent =
text;
box.style.display =
"block";
}
function hideMessage(){
const box =
document.getElementById("message");
box.textContent =
"";
box.style.display =
"none";
}
/*
================================================
FORM SWITCH
================================================
*/
function showForm(type){
hideMessage();
document
.getElementById("loginTab")
.classList.toggle(
"active",
type==="login"
);
document
.getElementById("signupTab")
.classList.toggle(
"active",
type==="signup"
);
document
.getElementById("loginForm")
.classList.toggle(
"active",
type==="login"
);
document
.getElementById("signupForm")
.classList.toggle(
"active",
type==="signup"
);
}
/*
================================================
LOGIN
================================================
*/
document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event){
event.preventDefault();
const button =
document.getElementById(
"loginButton"
);
button.disabled =
true;
button.textContent =
"Logging in...";
const email =
document
.getElementById("loginEmail")
.value
.trim();
const password =
document
.getElementById("loginPassword")
.value;
const {
data,
error
} =
await client.auth.signInWithPassword({
email:
email,
password:
password
});
if(error){
showMessage(
error.message
);
button.disabled =
false;
button.textContent =
"Login";
return;
}
if(!data.session){
showMessage(
"Login completed, but no session was created. Please try again."
);
button.disabled =
false;
button.textContent =
"Login";
return;
}
/*
Make sure the user's profile exists.
*/
const user =
data.user;
const {
data:profile
} =
await client
.from("profiles")
.select("id")
.eq(
"id",
user.id
)
.maybeSingle();
if(!profile){
await client
.from("profiles")
.insert({
id:
user.id,
username:
user.user_metadata?.username ||
email.split("@")[0]
});
}
/*
================================================
REFERRAL LOGIN FLOW
================================================
Referral link:
index.html?ref=EHXXXXXXXX
↓
Login
↓
referral.html?ref=EHXXXXXXXX
↓
Refer & Earn
↓
Code automatically appears
↓
User presses Apply
*/
const savedReferralCode =
loadSavedReferralCode();
if(savedReferralCode){
window.location.href =
"referral.html?ref=" +
encodeURIComponent(
savedReferralCode
);
return;
}
/*
Normal login goes to dashboard.
*/
window.location.href =
"dashboard.html";
});
/*
================================================
SIGN UP
================================================
*/
document
.getElementById("signupForm")
.addEventListener(
"submit",
async function(event){
event.preventDefault();
const button =
document.getElementById(
"signupButton"
);
button.disabled =
true;
button.textContent =
"Creating account...";
const username =
document
.getElementById("signupUsername")
.value
.trim();
const email =
document
.getElementById("signupEmail")
.value
.trim();
const password =
document
.getElementById("signupPassword")
.value;
/*
Basic validation.
*/
if(!username){
showMessage(
"Please enter a username."
);
button.disabled =
false;
button.textContent =
"Create Account";
return;
}
if(!email){
showMessage(
"Please enter your email."
);
button.disabled =
false;
button.textContent =
"Create Account";
return;
}
if(password.length < 6){
showMessage(
"Password must be at least 6 characters."
);
button.disabled =
false;
button.textContent =
"Create Account";
return;
}
/*
Create Supabase account.
*/
const {
data,
error
} =
await client.auth.signUp({
email:
email,
password:
password,
options:{
data:{
username:
username
},
emailRedirectTo:
window.location.origin +
"/index.html"
}
});
if(error){
showMessage(
error.message
);
button.disabled =
false;
button.textContent =
"Create Account";
return;
}
/*
If email confirmation is enabled,
Supabase may not return a session.
Referral code remains saved.
*/
if(!data.session){
showMessage(
"Account created. Please confirm your email, then return here and login."
);
button.disabled =
false;
button.textContent =
"Create Account";
return;
}
/*
================================================
CREATE PROFILE
================================================
*/
const user =
data.user;
const {
error:profileError
} =
await client
.from("profiles")
.upsert({
id:
user.id,
username:
username
});
if(profileError){
console.log(
"Profile creation error:",
profileError.message
);
}
/*
================================================
AFTER SIGNUP
================================================
If referral code exists,
go to Refer & Earn page.
Do not automatically apply it.
*/
const savedReferralCode =
loadSavedReferralCode();
if(savedReferralCode){
window.location.href =
"referral.html?ref=" +
encodeURIComponent(
savedReferralCode
);
return;
}
/*
Normal signup goes to dashboard.
*/
showMessage(
"Account created successfully."
);
setTimeout(
function(){
window.location.href =
"dashboard.html";
},
1000
);
});
/*
================================================
CHECK EXISTING SESSION
================================================
*/
(async function(){
/*
First process referral URL.
This saves:
?ref=EHXXXXXXXX
into localStorage.
*/
initializeReferral();
/*
Then check existing session.
*/
const {
data
} =
await client.auth.getSession();
if(data.session){
/*
If already logged in and referral
code exists, go to Refer & Earn.
*/
const savedReferralCode =
loadSavedReferralCode();
if(savedReferralCode){
window.location.href =
"referral.html?ref=" +
encodeURIComponent(
savedReferralCode
);
return;
}
/*
Normal logged-in user.
*/
window.location.href =
"dashboard.html";
}
})();
</script>
</body>
</html>
