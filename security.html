<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>EarningHub Security</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:700px;
min-height:100vh;
margin:auto;
padding:0 20px 30px
}


/* APP BAR */

header{
height:90px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:3px solid #111;
background:#fff
}

.back-button{
width:40px;
height:40px;
border:0;
background:#fff;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.back-button:active{
background:#f3f3f3
}

.back-button svg{
width:23px;
height:23px;
stroke:#111;
stroke-width:2;
fill:none;
stroke-linecap:round;
stroke-linejoin:round
}

.logo{
width:105px;
height:auto;
display:block;
object-fit:contain
}

.header-space{
width:40px
}


/* MAIN */

.main{
padding-top:25px
}

.page-title{
margin-bottom:25px
}

.page-title small{
color:#777;
font-size:13px
}

.page-title h1{
font-size:28px;
margin-top:6px
}


/* SECURITY */

.security{
display:flex;
flex-direction:column;
gap:12px
}

.security-card{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
background:#fff
}

.security-button{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
border:0;
background:#fff;
color:#111;
padding:0;
text-align:left;
cursor:pointer
}

.security-left{
display:flex;
align-items:center;
gap:13px
}

.security-icon{
width:40px;
height:40px;
border-radius:10px;
background:#f3f3f3;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
flex-shrink:0
}

.security-text h2{
font-size:16px;
margin-bottom:6px
}

.security-text p{
font-size:13px;
color:#777;
line-height:1.5
}

.security-arrow{
font-size:20px;
color:#777
}


/* CHANGE PASSWORD */

.password-section{
display:none;
margin-top:12px;
border-top:1px solid #eee;
padding-top:16px
}

.password-section.show{
display:block
}

.password-label{
display:block;
font-size:12px;
color:#777;
margin-bottom:6px
}

.password-input{
width:100%;
height:46px;
border:1px solid #ccc;
border-radius:10px;
padding:0 13px;
font-size:14px;
outline:none;
margin-bottom:12px
}

.password-input:focus{
border-color:#111
}

.password-button{
width:100%;
border:0;
background:#111;
color:#fff;
padding:13px;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.password-button:disabled{
opacity:.5;
cursor:not-allowed
}

.password-message{
display:none;
margin-top:12px;
padding:12px;
border-radius:10px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}


/* ACCOUNT EMAIL */

.email-section{
display:none;
margin-top:12px;
border-top:1px solid #eee;
padding-top:16px
}

.email-section.show{
display:block
}

.email-label{
display:block;
font-size:12px;
color:#777;
margin-bottom:6px
}

.current-email{
border:1px solid #ddd;
border-radius:10px;
padding:13px;
font-size:14px;
word-break:break-all;
margin-bottom:12px;
background:#f8f8f8
}

.email-input{
width:100%;
height:46px;
border:1px solid #ccc;
border-radius:10px;
padding:0 13px;
font-size:14px;
outline:none;
margin-bottom:12px
}

.email-input:focus{
border-color:#111
}

.email-button{
width:100%;
border:0;
background:#111;
color:#fff;
padding:13px;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

.email-button:disabled{
opacity:.5;
cursor:not-allowed
}

.email-message{
display:none;
margin-top:12px;
padding:12px;
border-radius:10px;
background:#f3f3f3;
font-size:13px;
line-height:1.5
}


/* INFO */

.info{
border:1px solid #ddd;
border-radius:16px;
padding:18px;
margin-top:20px
}

.info strong{
font-size:15px
}

.info p{
font-size:13px;
color:#777;
line-height:1.5;
margin-top:7px
}


/* FOOTER */

footer{
text-align:center;
padding:35px 0 20px;
color:#888;
font-size:12px
}


/* MOBILE */

@media(max-width:600px){

.app{
max-width:480px;
padding:0 20px 20px
}

header{
height:90px
}

.logo{
width:105px
}

.page-title h1{
font-size:26px
}

}

</style>

</head>


<body>

<div class="app">


<!-- APP BAR -->

<header>

<button
class="back-button"
type="button"
onclick="goSettings()"
aria-label="Back"
>

<svg viewBox="0 0 24 24">

<line
x1="19"
y1="12"
x2="5"
y2="12">
</line>

<polyline
points="12 19 5 12 12 5">
</polyline>

</svg>

</button>


<img
class="logo"
src="./logo.PNG"
alt="EarningHub Logo"
>


<div class="header-space"></div>

</header>


<!-- MAIN -->

<div class="main">


<div class="page-title">

<small>
EarningHub
</small>

<h1>
Security
</h1>

</div>


<div class="security">


<!-- PASSWORD -->

<div class="security-card">

<button
class="security-button"
type="button"
onclick="togglePassword()"
>

<div class="security-left">

<div class="security-icon">
🔑
</div>

<div class="security-text">

<h2>
Change Password
</h2>

<p>
Update your EarningHub account password.
</p>

</div>

</div>

<div class="security-arrow">
›
</div>

</button>


<div
id="passwordSection"
class="password-section"
>

<label
class="password-label"
for="newPassword">

New Password

</label>

<input
id="newPassword"
class="password-input"
type="password"
placeholder="Enter new password"
autocomplete="new-password"
>


<label
class="password-label"
for="confirmPassword">

Confirm New Password

</label>

<input
id="confirmPassword"
class="password-input"
type="password"
placeholder="Confirm new password"
autocomplete="new-password"
>


<button
id="passwordButton"
class="password-button"
type="button"
onclick="changePassword()"
>

Update Password

</button>


<div
id="passwordMessage"
class="password-message">
</div>

</div>

</div>


<!-- ACCOUNT EMAIL -->

<div class="security-card">

<button
class="security-button"
type="button"
onclick="showAccountEmail()"
>

<div class="security-left">

<div class="security-icon">
📧
</div>

<div class="security-text">

<h2>
Account Email
</h2>

<p>
View and change the email address connected to your account.
</p>

</div>

</div>

<div class="security-arrow">
›
</div>

</button>


<div
id="emailSection"
class="email-section"
>

<label class="email-label">

Current Account Email

</label>

<div
id="currentEmail"
class="current-email">

Loading email...

</div>


<label
class="email-label"
for="newEmail">

Change Email

</label>

<input
id="newEmail"
class="email-input"
type="email"
placeholder="Enter new email address"
autocomplete="email"
>


<button
id="emailButton"
class="email-button"
type="button"
onclick="changeEmail()"
>

Change Email

</button>


<div
id="emailMessage"
class="email-message">
</div>

</div>

</div>


<!-- SESSION -->

<div class="security-card">

<button
class="security-button"
type="button"
onclick="signOut()"
>

<div class="security-left">

<div class="security-icon">
🚪
</div>

<div class="security-text">

<h2>
Sign Out
</h2>

<p>
Sign out from your current EarningHub account.
</p>

</div>

</div>

<div class="security-arrow">
›
</div>

</button>

</div>


</div>


<!-- INFO -->

<div class="info">

<strong>
EarningHub Account Security
</strong>

<p>
Keep your password private and use a strong password that you do not use on other websites.
</p>

</div>


<footer>

© 2026 EarningHub

</footer>


</div>

</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


/*
SUPABASE
*/

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/*
GO TO SETTINGS
*/

function goSettings(){

window.location.href =
"settings.html";

}


/*
TOGGLE PASSWORD
*/

function togglePassword(){

const section =
document.getElementById(
"passwordSection"
);

section.classList.toggle(
"show"
);

}


/*
CHANGE PASSWORD
*/

async function changePassword(){

const newPassword =
document.getElementById(
"newPassword"
).value;

const confirmPassword =
document.getElementById(
"confirmPassword"
).value;

const button =
document.getElementById(
"passwordButton"
);

const message =
document.getElementById(
"passwordMessage"
);


message.style.display =
"none";


if(!newPassword){

message.textContent =
"Please enter a new password.";

message.style.display =
"block";

return;

}


if(newPassword.length < 6){

message.textContent =
"Password must contain at least 6 characters.";

message.style.display =
"block";

return;

}


if(newPassword !== confirmPassword){

message.textContent =
"Passwords do not match.";

message.style.display =
"block";

return;

}


button.disabled =
true;

button.textContent =
"Updating...";


const {
error
} =
await client.auth.updateUser({

password:
newPassword

});


if(error){

message.textContent =
"Unable to update password: " +
error.message;

message.style.display =
"block";

button.disabled =
false;

button.textContent =
"Update Password";

return;

}


message.textContent =
"Your password has been updated successfully.";

message.style.display =
"block";


document.getElementById(
"newPassword"
).value =
"";

document.getElementById(
"confirmPassword"
).value =
"";


button.disabled =
false;

button.textContent =
"Update Password";

}


/*
ACCOUNT EMAIL
*/

async function showAccountEmail(){

const section =
document.getElementById(
"emailSection"
);

section.classList.toggle(
"show"
);


if(
!section.classList.contains(
"show"
)
){

return;

}


const currentEmail =
document.getElementById(
"currentEmail"
);


currentEmail.textContent =
"Loading email...";


const {
data,
error
} =
await client.auth.getSession();


if(error){

currentEmail.textContent =
"Unable to load email.";

console.log(
"Email error:",
error.message
);

return;

}


if(
!data ||
!data.session ||
!data.session.user
){

currentEmail.textContent =
"Not signed in.";

return;

}


const email =
data.session.user.email ||
"Not available";


currentEmail.textContent =
email;

}


/*
CHANGE EMAIL
*/

async function changeEmail(){

const input =
document.getElementById(
"newEmail"
);

const button =
document.getElementById(
"emailButton"
);

const message =
document.getElementById(
"emailMessage"
);

const newEmail =
input.value.trim();


message.style.display =
"none";


if(!newEmail){

message.textContent =
"Please enter a new email address.";

message.style.display =
"block";

return;

}


if(
!newEmail.includes("@")
){

message.textContent =
"Please enter a valid email address.";

message.style.display =
"block";

return;

}


button.disabled =
true;

button.textContent =
"Updating...";


const {
error
} =
await client.auth.updateUser({

email:
newEmail

});


if(error){

message.textContent =
"Unable to change email: " +
error.message;

message.style.display =
"block";

button.disabled =
false;

button.textContent =
"Change Email";

return;

}


message.textContent =
"Email change requested. Please check your email and confirm the new address.";

message.style.display =
"block";

input.value =
"";


button.disabled =
false;

button.textContent =
"Change Email";

}


/*
SIGN OUT
*/

async function signOut(){

const confirmLogout =
window.confirm(
"Do you want to sign out from EarningHub?"
);


if(!confirmLogout){

return;

}


const {
error
} =
await client.auth.signOut();


if(error){

alert(
"Unable to sign out. Please try again."
);

console.log(
"Sign out error:",
error.message
);

return;

}


window.location.href =
"index.html";

}

</script>


</body>

</html>
