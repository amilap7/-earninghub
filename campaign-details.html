<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Campaign Details - EarningHub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
cursor:pointer
}

.loading{
text-align:center;
padding:50px 15px;
color:#777
}

.message{
display:none;
padding:14px;
border-radius:12px;
background:#f3f3f3;
font-size:13px;
line-height:1.5;
margin-bottom:15px
}

.card{
border:1px solid #ddd;
border-radius:18px;
padding:18px;
background:#fff;
margin-bottom:15px
}

.title{
font-size:27px;
font-weight:800;
line-height:1.25;
margin-bottom:12px
}

.status{
display:inline-block;
padding:7px 10px;
border-radius:8px;
background:#eee;
font-size:11px;
font-weight:bold;
margin-bottom:18px
}

.description{
font-size:14px;
line-height:1.6;
color:#555;
margin-bottom:20px
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
margin-bottom:12px;
font-size:14px
}

.row span{
color:#777
}

.row strong{
text-align:right;
word-break:break-word
}

.amount-box{
border:1px solid #ddd;
border-radius:14px;
padding:16px;
margin-top:18px;
background:#fafafa
}

.amount-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px
}

.amount-row:last-child{
margin-bottom:0
}

.amount-row strong{
font-size:16px
}

.reward{
font-size:25px;
font-weight:800;
margin-bottom:5px
}

.reward-label{
font-size:12px;
color:#777
}

.url{
display:block;
margin-top:18px;
padding:13px;
border-radius:11px;
background:#111;
color:#fff;
text-decoration:none;
text-align:center;
font-weight:bold;
word-break:break-word
}

.back-list{
display:block;
width:100%;
padding:13px;
border:1px solid #111;
border-radius:11px;
background:#fff;
color:#111;
text-decoration:none;
text-align:center;
font-weight:bold;
margin-top:10px
}

.info{
font-size:13px;
line-height:1.5;
color:#777;
margin-top:16px
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub
</div>

<button
class="back"
onclick="goBack()">
Back
</button>

</header>


<div
id="loading"
class="loading">
Loading campaign...
</div>


<div
id="message"
class="message">
</div>


<div
id="content"
style="display:none">
</div>

</div>


<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

/*
Use the same Supabase Publishable Key
used by your other EarningHub pages.

Never put the Supabase secret/service_role
key here.
*/

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   MESSAGE
========================= */

function showMessage(text){

const box =
document.getElementById("message");

box.textContent =
text;

box.style.display =
"block";

}


/* =========================
   BACK
========================= */

function goBack(){

window.location.href =
"my-campaigns.html";

}


/* =========================
   AUTH
========================= */

async function getCurrentUser(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error){

throw new Error(
error.message
);

}


if(
data.session &&
data.session.user
){

return data.session.user;

}


return null;

}


/* =========================
   GET CAMPAIGN ID
========================= */

function getCampaignId(){

const params =
new URLSearchParams(
window.location.search
);

return params.get("id");

}


/* =========================
   LOAD CAMPAIGN
========================= */

async function loadCampaign(){

const loading =
document.getElementById(
"loading"
);

try{

const user =
await getCurrentUser();


if(!user){

window.location.href =
"login.html";

return;

}


const campaignId =
getCampaignId();


if(!campaignId){

throw new Error(
"Campaign ID is missing."
);

}


/*
Only allow the logged-in creator
to view their own campaign.
*/

const {
data:campaign,
error
} =
await supabaseClient
.from("campaigns")
.select(`
id,
creator_id,
title,
description,
platform,
task_type,
target_url,
reward,
budget,
status,
created_at
`)
.eq(
"id",
campaignId
)
.eq(
"creator_id",
user.id
)
.maybeSingle();


if(error){

throw new Error(
error.message
);

}


if(!campaign){

throw new Error(
"Campaign not found or you do not have permission to view it."
);

}


renderCampaign(
campaign
);


loading.style.display =
"none";


}catch(error){

loading.style.display =
"none";

showMessage(
"Unable to load campaign: " +
error.message
);

}

}


/* =========================
   RENDER CAMPAIGN
========================= */

function renderCampaign(
campaign
){

const content =
document.getElementById(
"content"
);

const budget =
Number(
campaign.budget || 0
);

const reward =
Number(
campaign.reward || 0
);


const createdAt =
campaign.created_at
?
new Date(
campaign.created_at
).toLocaleString()
:
"-";


let targetButton = "";

if(campaign.target_url){

targetButton = `

<a
class="url"
href="${escapeHtml(
campaign.target_url
)}"
target="_blank"
rel="noopener">

Open Target URL

</a>

`;

}


content.innerHTML = `

<div class="card">

<div class="title">
${escapeHtml(
campaign.title || "Campaign"
)}
</div>

<div class="status">
${escapeHtml(
formatStatus(
campaign.status
)
)}
</div>

<div class="description">
${escapeHtml(
campaign.description || "No description."
)}
</div>

<div class="row">
<span>Platform</span>
<strong>
${escapeHtml(
campaign.platform || "-"
)}
</strong>
</div>

<div class="row">
<span>Task type</span>
<strong>
${escapeHtml(
formatTaskType(
campaign.task_type
)
)}
</strong>
</div>

<div class="row">
<span>Created</span>
<strong>
${escapeHtml(
createdAt
)}
</strong>
</div>

<div class="amount-box">

<div class="amount-row">
<span>Reward / completion</span>
<strong>
$${reward.toFixed(2)}
</strong>
</div>

<div class="amount-row">
<span>Total campaign budget</span>
<strong>
$${budget.toFixed(2)}
</strong>
</div>

<div style="margin-top:15px">

<div class="reward">
$${budget.toFixed(2)}
</div>

<div class="reward-label">
Campaign budget
</div>

</div>

</div>

${targetButton}

<div class="info">
Campaign status: 
<strong>
${escapeHtml(
formatStatus(
campaign.status
)
)}
</strong>
</div>

</div>


<a
class="back-list"
href="my-campaigns.html">

Back to My Campaigns

</a>

`;

content.style.display =
"block";

}


/* =========================
   STATUS
========================= */

function formatStatus(status){

switch(status){

case "pending_payment":
return "PENDING PAYMENT";

case "payment_review":
return "PAYMENT REVIEW";

case "active":
return "ACTIVE";

case "rejected":
return "REJECTED";

case "completed":
return "COMPLETED";

default:
return String(
status || "UNKNOWN"
).toUpperCase();

}

}


/* =========================
   TASK TYPE
========================= */

function formatTaskType(type){

switch(type){

case "video_watch":
return "Video Watch";

case "website_visit":
return "Website Visit";

case "feedback":
return "Feedback";

case "survey":
return "Survey";

case "content_discovery":
return "Content Discovery";

default:
return type || "-";

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =========================
   START
========================= */

loadCampaign();

</script>

</body>
</html>
