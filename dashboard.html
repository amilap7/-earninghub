/* HELPERS */

function byId(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function formatMoney(value){
  const amount = Number(value);
  if(!Number.isFinite(amount)) return "—";

  return "$" + amount.toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function formatNumber(value){
  const amount = Number(value);
  if(!Number.isFinite(amount)) return "—";

  return Math.round(amount).toLocaleString("en-US");
}

function formatDate(date){
  const d = new Date(date);

  if(Number.isNaN(d.getTime())) return "";

  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function initialsAvatar(name){
  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name || "User") +
    "&background=142b47&color=ffe49a&bold=true";
}

function safeAvatar(url,name){
  if(typeof url === "string" &&
     /^https?:\/\//i.test(url)){
    return url;
  }

  return initialsAvatar(name);
}

function logError(section,error){
  if(error){

}

/* MEMBER LEVEL */

function updateLevel(points){
  let current = LEVELS[0];
  let next = null;

  for(let i=0;i<LEVELS.length;i++){
    if(points >= LEVELS[i].min){
      current = LEVELS[i];
      next = LEVELS[i+1] || null;
    }
  }

  byId("levelNumber").textContent =
    "LEVEL " + current.level;

  byId("levelTitle").textContent = current.name;
  byId("levelIcon").textContent = current.icon;

  /*
  Do not overwrite ADMIN badge with member level.
  */

  if(!currentProfile?.is_admin){
    byId("memberBadge").textContent =
      "⭐ " + current.name;
  }

  byId("currentPoints").textContent =
    formatNumber(points);

  if(next){
    const needed = Math.max(0,next.min-points);

    const progress = Math.max(
      0,
      Math.min(
        100,
        ((points-current.min)/(next.min-current.min))*100
      )
    );

    byId("nextLevel").textContent =
      "LEVEL " + next.level;

    byId("pointsNeeded").textContent =
      formatNumber(needed);

    byId("progressPercent").textContent =
      Math.floor(progress) + "%";

    byId("levelProgress").style.width =
      progress + "%";

    byId("progressLabel").textContent =
      formatNumber(points-current.min) + " / " +
      formatNumber(next.min-current.min) + " points";

    byId("levelNote").textContent =
      "Member levels use the thresholds configured on this page.";
  }else{
    byId("nextLevel").textContent = "MAX LEVEL";
    byId("pointsNeeded").textContent = "0";
    byId("progressPercent").textContent = "100%";
    byId("levelProgress").style.width = "100%";

    byId("progressLabel").textContent =
      "Maximum configured level reached";

    byId("levelNote").textContent =
      "You have reached the highest configured level.";
  }
}

    if(error){

      message.style.display = "block";
      button.disabled = false;
      button.textContent = "Claim Daily Bonus +10";

      message.style.display = "block";
      button.disabled = false;
      button.textContent = "Claim Daily Bonus +10";
      return;
    }

    if(data.success){
      message.textContent =
        data.message || "Daily bonus claimed successfully.";

      if(Number(data.reward || 0) > 0){
        message.textContent += " " +
          formatMoney(data.reward) +
          " has been added to your wallet.";
      }

      message.style.display = "block";

      await refreshDashboard("bonus");

      button.textContent = "Daily Bonus Claimed ✓";
    }else{
      message.textContent =
        data.message || "Daily bonus could not be claimed.";

      message.style.display = "block";

      if(
        data.message &&
        data.message.toLowerCase().includes("already claimed")
      ){
        button.disabled = true;
        button.textContent = "Daily Bonus Claimed ✓";
      }else{
        button.disabled = false;
        button.textContent = "Claim Daily Bonus +10";
      }
    }
  }catch(error){
    logError("Daily bonus claim",error);

    message.textContent =
      "Something went wrong. Please try again.";

    message.style.display = "block";
    button.disabled = false;
    button.textContent = "Claim Daily Bonus +10";
  }
}

    note.textContent =

  }).join("");

  note.textContent =
    "Ranked by points recorded in daily_bonuses.";

      "Actual launch date has not been configured";

/* WITHDRAWAL STATISTICS */

async function loadPayoutStats(){
  const {data,error} = await client
    .from("withdrawals")
    .select("amount,status");

  if(error){
    logError("Payout statistics",error);
    byId("totalPayouts").textContent = "—";
    return;
  }

  const rows = data || [];

  /*
  The dashboard says "Total Payouts".
  Count approved, paid, or completed records only.
  Rejected and pending requests are excluded.
  */

  const successful = rows.filter(function(row){
    const status = String(row.status || "").toLowerCase();

    return [
      "paid",
      "completed",
      "success",
      "successful",
      "approved"
    ].includes(status);
  });

  const total = successful.reduce(function(sum,row){
    const amount = Number(row.amount || 0);

    return sum + (
      Number.isFinite(amount) && amount > 0
        ? amount
        : 0
    );
  },0);

  byId("totalPayouts").textContent =
    formatMoney(total);
}

/* TRANSACTION HELPERS */

function getTransactionAmount(row){
  const possible = [
    row.amount,
    row.value,
    row.earned_amount,
    row.reward_amount,
    row.credit,
    row.total
  ];

  for(const item of possible){
    if(item !== null && item !== undefined && item !== ""){
      const value = Number(item);

      if(Number.isFinite(value)) return value;
    }
  }

  return null;
}

function getTransactionDate(row){
  const possible = [
    row.created_at,
    row.transaction_date,
    row.date,
    row.createdAt
  ];

  for(const item of possible){
    if(item){
      const date = new Date(item);

      if(!Number.isNaN(date.getTime())) return date;
    }
  }

  return null;
}

function isEarningTransaction(row){
  const status = String(row.status || "").toLowerCase();

  const type = String(
    row.type || row.transaction_type || row.category || ""
  ).toLowerCase();

  if(status && ![
    "completed",
    "success",
    "successful",
    "approved",
    "paid"
  ].includes(status)){
    return false;
  }

  if(type){
    if(
      type.includes("withdraw") ||
      type.includes("debit") ||
      type.includes("purchase") ||
      type.includes("payment")
    ){
      return false;
    }

    return (
      type.includes("earn") ||
      type.includes("reward") ||
      type.includes("bonus") ||
      type.includes("credit") ||
      type.includes("task") ||
      type.includes("quiz") ||
      type.includes("spin") ||
      type.includes("referral") ||
      type.includes("ad_watch")
    );
  }

  return false;
}

/* USER EARNINGS */

async function loadEarnings(userId){
  const {data,error} = await client
    .from("transactions")
    .select("id,user_id,type,amount,description,created_at")
    .eq("user_id",userId)

    chartRecords = [];

        date:getTransactionDate(row)
      };
    })
    .filter(function(item){
      return item.amount !== null &&
        item.amount > 0 &&
        item.date !== null;
    });

  if(chartRecords.length){
    const total = chartRecords.reduce(
      (sum,row)=>sum+row.amount,0
    );

    byId("totalEarned").textContent =
      formatMoney(total);
  }else{
    byId("totalEarned").textContent = formatMoney(0);
  }

  renderChart();
}

/* CHART */

function changeChartRange(range,button){
  currentChartRange = range;

  document.querySelectorAll(".chart-tab").forEach(function(tab){
    tab.classList.toggle("active",tab===button);
  });

  renderChart();
}

function startOfWeek(date){
  const d = new Date(date);
  const day = (d.getDay()+6)%7;

  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);

  return d;
}

function renderChart(){
  const canvas = byId("earningsChart");
  const empty = byId("chartEmpty");
  const area = byId("chartArea");

  if(chartInstance){
    chartInstance.destroy();
    chartInstance = null;
  }

  if(!chartRecords.length){
    area.style.display = "none";
    empty.style.display = "block";

    byId("chartTotal").textContent = formatMoney(0);
    byId("chartCaption").textContent =
      "No recorded earnings found";

    return;
  }

  area.style.display = "block";
  empty.style.display = "none";

  const now = new Date();
  const grouped = {};
  const labels = [];

  if(currentChartRange === "daily"){
    for(let i=6;i>=0;i--){
      const d = new Date(now);

      d.setDate(now.getDate()-i);

      const key = formatDate(d);

      labels.push(
        d.toLocaleDateString("en-US",{weekday:"short"})
      );

      grouped[key] = 0;
    }
  }else if(currentChartRange === "weekly"){
    for(let i=7;i>=0;i--){
      const d = new Date(now);

      d.setDate(now.getDate()-i*7);

      const start = startOfWeek(d);
      const key = formatDate(start);

      labels.push(
        start.toLocaleDateString("en-US",{
          month:"short",
          day:"numeric"
        })
      );

      grouped[key] = 0;
    }
  }else{
    for(let i=5;i>=0;i--){
      const d = new Date(
        now.getFullYear(),
        now.getMonth()-i,
        1
      );

      const key =
        d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0");

      labels.push(
        d.toLocaleDateString("en-US",{month:"short"})
      );

      grouped[key] = 0;
    }
  }

  chartRecords.forEach(function(row){
    let key;

    if(currentChartRange === "daily"){
      key = formatDate(row.date);
    }else if(currentChartRange === "weekly"){
      key = formatDate(startOfWeek(row.date));
    }else{
      key = row.date.getFullYear() + "-" +
        String(row.date.getMonth()+1).padStart(2,"0");
    }

    if(Object.prototype.hasOwnProperty.call(grouped,key)){
      grouped[key] += row.amount;
    }
  });

  const values = Object.values(grouped);

  const total = values.reduce(
    (sum,value)=>sum+value,0
  );

  byId("chartTotal").textContent =
    formatMoney(total);

  byId("chartCaption").textContent =
    currentChartRange === "daily"
      ? "Last 7 days"
      : currentChartRange === "weekly"
        ? "Last 8 weeks"
        : "Last 6 months";

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createLinearGradient(0,0,0,230);

  gradient.addColorStop(0,"rgba(245,196,81,0.32)");
  gradient.addColorStop(1,"rgba(245,196,81,0.01)");

  chartInstance = new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[{
        label:"Earnings",
        data:values,
        borderColor:"#f5c451",
        backgroundColor:gradient,
        borderWidth:2.5,
        fill:true,
        tension:.38,
        pointRadius:3,
        pointHoverRadius:5,
        pointBackgroundColor:"#ffe49a",
        pointBorderColor:"#f5c451"
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:function(context){
              return " " + formatMoney(context.parsed.y);
            }
          }
        }
      },
      scales:{
        x:{
          grid:{display:false},
          ticks:{
            color:"#91a3bb",
            font:{size:10}
          }
        },
        y:{
          beginAtZero:true,
          grid:{color:"rgba(145,163,187,.12)"},
          ticks:{
            color:"#91a3bb",
            font:{size:10},
            callback:function(value){
              return "$" + value;
            }
          }
        }
      }
    }
  });
}

/* NOTIFICATIONS */

async function loadNotificationCount(userId){
  const {count,error} = await client
    .from("notifications")
    .select("id",{count:"exact",head:true})
    .eq("user_id",userId)
    .eq("is_read",false);

  if(error){
    logError("Notification count",error);
    return;
  }

  const dot = byId("notificationDot");
  const unread = Number(count || 0);

  if(unread > 0){
    dot.textContent = unread > 99 ? "99+" : unread;
    dot.style.display = "flex";
  }else{
    dot.style.display = "none";
  }
}

/* MY CAMPAIGNS */

async function loadMyCampaigns(userId){
  const {data,error} = await client
    .from("campaigns")
    .select("id")
    .eq("creator_id",userId)
    .limit(1);

  if(error){
    logError("Campaign loading",error);

    byId("campaignDescription").textContent =
      "Your campaigns could not be loaded right now.";

    return;
  }

  if(data && data.length){
    byId("campaignDescription").textContent =
      "You have created campaigns. Open My Campaigns to view details.";
  }else{
    byId("campaignDescription").textContent =
      "You have not created a campaign yet. Start creating one to see it here.";
  }
}

/* REFRESH DASHBOARD */

async function refreshDashboard(reason){
  if(!currentUserId || destroyed) return;

  /*
  Prevent multiple simultaneous refreshes.
  If another event arrives during refresh, run again afterward.
  */

  if(refreshInProgress){
    refreshRequested = true;
    return;
  }

  refreshInProgress = true;

  try{
    const userId = currentUserId;

    const tasks = [
      loadProfile(currentUser),
      loadWallet(userId),
      loadDailyBonus(userId),
      loadNotificationCount(userId),
      loadMyCampaigns(userId),
      loadLeaderboard(),
      loadPlatformStats(),
      loadPayoutStats(),
      loadEarnings(userId)
    ];

    await Promise.allSettled(tasks);

  }catch(error){
    logError("Dashboard refresh",error);
  }finally{
    refreshInProgress = false;

    if(refreshRequested && !destroyed){
      refreshRequested = false;

      setTimeout(function(){
        refreshDashboard("queued");
      },500);
    }
  }
}

/* REALTIME SUBSCRIPTIONS */

function subscribeToRealtime(){
  if(!currentUserId) return;

  if(realtimeChannel){
    client.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = client
    .channel("earninghub-dashboard-" + currentUserId)

    /*
    New signups and profile updates.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"profiles"
      },
      function(payload){
        refreshDashboard("profiles");

        if(
          payload.new &&
          payload.new.id === currentUserId
        ){
          loadProfile(currentUser);
        }
      }
    )

    /*
    Wallet balances.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"wallets"
      },
      function(payload){
        if(
          !payload.new?.user_id ||
          payload.new.user_id === currentUserId ||
          payload.eventType === "DELETE"
        ){
          loadWallet(currentUserId);
        }else{
          loadPlatformWalletTotal();
        }
      }
    )

    /*
    Earnings transactions.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"transactions"
      },
      function(payload){
        const row = payload.new || payload.old;

        if(!row?.user_id || row.user_id === currentUserId){
          loadEarnings(currentUserId);
        }
      }
    )

    /*
    Daily bonus changes affect points and leaderboard.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"daily_bonuses"
      },
      function(){
        loadDailyBonus(currentUserId);
        loadLeaderboard();
        loadPlatformStats();
      }
    )

    /*
    Withdrawal approvals and requests.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"withdrawals"
      },
      function(){
        loadPayoutStats();
      }
    )

    /*
    Notifications.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"notifications",
        filter:"user_id=eq." + currentUserId
      },
      function(){
        loadNotificationCount(currentUserId);
      }
    )

    /*
    Campaign updates.
    */

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"campaigns",
        filter:"creator_id=eq." + currentUserId
      },
      function(){
        loadMyCampaigns(currentUserId);
      }
    )

    .subscribe(function(status){
      console.log("[EarningHub Realtime]",status);

      if(status === "CHANNEL_ERROR"){
        console.warn(
          "Realtime connection failed. Automatic refresh remains enabled."
        );
      }
    });
}

/* LOGOUT */

async function logout(){
  destroyed = true;

  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer = null;
  }

  if(realtimeChannel){
    await client.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  const {error} = await client.auth.signOut();

  if(error){
    destroyed = false;

    alert("Unable to log out. Please try again.");

    logError("Logout",error);
    return;
  }

  window.location.href = "index.html";
}

/* START */

async function loadUser(){
  try{
    const {data,error} = await client.auth.getSession();

    if(error){
      logError("Session",error);
      window.location.href = "index.html";
      return;
    }

    if(!data.session){
      window.location.href = "index.html";
      return;
    }

    currentUser = data.session.user;
    currentUserId = currentUser.id;

    const profile = await loadProfile(currentUser);

    if(
      (currentUser.email || "").toLowerCase() ===
      "earninghubadmin@gmail.com" ||
      profile?.is_admin === true
    ){
      byId("adminReview").style.display = "block";
    }

    /*
    Load the actual current database data first.
    */

    await refreshDashboard("initial");

    /*
    Listen for database changes.
    Realtime needs the relevant tables enabled in Supabase.
    */

    subscribeToRealtime();

    /*
    Fallback refresh: works even if Realtime is unavailable,
    subject to database access and network connectivity.
    */

    refreshTimer = setInterval(function(){
      if(document.visibilityState === "visible"){
        refreshDashboard("poll");
      }
    },REFRESH_INTERVAL);

  }catch(error){
    logError("Dashboard startup",error);
  }
}

/* Refresh when the user returns to the page */

document.addEventListener("visibilitychange",function(){
  if(
    document.visibilityState === "visible" &&
    currentUserId &&
    !destroyed
  ){
    refreshDashboard("visible");
  }
});

window.addEventListener("online",function(){
  if(currentUserId && !destroyed){
    refreshDashboard("online");
  }
});

window.addEventListener("beforeunload",function(){
  destroyed = true;

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  if(realtimeChannel){
    client.removeChannel(realtimeChannel);
  }
});

loadUser();
</script>
