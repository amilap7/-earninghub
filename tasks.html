<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub Tasks</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#fff;
color:#111
}

.app{
max-width:480px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:8px 0 25px
}

.logo{
font-size:24px;
font-weight:800
}

.back{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold
}

.title{
margin-bottom:20px
}

.title h1{
font-size:30px;
margin-bottom:8px
}

.title p{
color:#777;
font-size:14px;
line-height:1.5
}

.search{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:12px;
margin-bottom:15px;
outline:none
}

.filters{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:20px
}

.filter{
white-space:nowrap;
padding:10px 14px;
border:1px solid #ccc;
border-radius:20px;
background:#fff
}

.filter.active{
background:#111;
color:#fff;
border-color:#111
}

.task{
border:1px solid #ddd;
border-radius:18px;
padding:18px;
margin-bottom:13px
}

.task-head{
display:flex;
justify-content:space-between;
gap:10px
}

.platform{
font-size:12px;
color:#777;
margin-bottom:7px
}

.task h2{
font-size:17px
}

.reward{
font-size:18px;
font-weight:800;
white-space:nowrap
}

.task p{
color:#666;
font-size:13px;
line-height:1.5;
margin-top:10px
}

.meta{
display:flex;
gap:8px;
margin-top:13px;
font-size:12px;
color:#777
}

.meta span{
background:#f4f4f4;
padding:7px 9px;
border-radius:8px
}

.start{
width:100%;
padding:13px;
border:0;
border-radius:11px;
background:#111;
color:#fff;
font-weight:bold;
margin-top:15px
}

.empty{
text-align:center;
padding:50px 20px;
color:#777
}

.loading{
text-align:center;
padding:50px
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">EarningHub</div>

<button class="back" onclick="goBack()">
Back
</button>

</header>

<div class="title">

<h1>Available Tasks</h1>

<p>
Complete tasks from verified campaigns
and earn rewards.
</p>

</div>

<input
class="search"
id="search"
placeholder="Search tasks..."
oninput="renderTasks()"
>

<div class="filters">

<button class="filter active"
onclick="setFilter('All',this)">
All
</button>

<button class="filter"
onclick="setFilter('YouTube',this)">
YouTube
</button>

<button class="filter"
onclick="setFilter('Facebook',this)">
Facebook
</button>

<button class="filter"
onclick="setFilter('TikTok',this)">
TikTok
</button>

<button class="filter"
onclick="setFilter('Instagram',this)">
Instagram
</button>

</div>

<div id="tasks">

<div class="loading">
Loading tasks...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/*
 Temporary tasks.
 These will be replaced by real
 Supabase campaigns.
*/

const demoTasks = [

{
id:"demo1",
platform:"YouTube",
title:"Watch a YouTube video",
description:"Watch the assigned video and complete the required activity.",
reward:0.05,
remaining:100
},

{
id:"demo2",
platform:"YouTube",
title:"Subscribe to a YouTube channel",
description:"Open the campaign link and subscribe to the specified channel.",
reward:0.10,
remaining:50
},

{
id:"demo3",
platform:"Facebook",
title:"Follow a Facebook page",
description:"Visit the campaign page and follow it.",
reward:0.10,
remaining:75
},

{
id:"demo4",
platform:"Facebook",
title:"Watch a Facebook Reel",
description:"Watch the assigned Reel and complete the campaign requirements.",
reward:0.05,
remaining:100
},

{
id:"demo5",
platform:"TikTok",
title:"Like a TikTok video",
description:"Open the campaign video and like it.",
reward:0.05,
remaining:100
},

{
id:"demo6",
platform:"TikTok",
title:"Follow a TikTok account",
description:"Visit the account and follow it.",
reward:0.10,
remaining:50
},

{
id:"demo7",
platform:"Instagram",
title:"Follow an Instagram account",
description:"Visit the campaign profile and follow it.",
reward:0.10,
remaining:50
},

{
id:"demo8",
platform:"Instagram",
title:"Watch an Instagram video",
description:"Watch the assigned video completely.",
reward:0.05,
remaining:100
}

];


let tasks = [];

let currentFilter="All";


function setFilter(filter,button){

currentFilter=filter;

document
.querySelectorAll(".filter")
.forEach(btn=>{
btn.classList.remove("active")
});

button.classList.add("active");

renderTasks();

}


function renderTasks(){

const container =
document.getElementById("tasks");

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let filtered=tasks.filter(task=>{

const platformMatch =
currentFilter==="All" ||
task.platform===currentFilter;

const searchMatch =
!search ||
task.title.toLowerCase().includes(search) ||
task.platform.toLowerCase().includes(search);

return platformMatch && searchMatch;

});


if(filtered.length===0){

container.innerHTML=`
<div class="empty">
<h3>No tasks found</h3>
<p>Try another search or category.</p>
</div>
`;

return;

}


container.innerHTML=filtered.map(task=>`

<div class="task">

<div class="task-head">

<div>

<div class="platform">
${escapeHtml(task.platform)}
</div>

<h2>
${escapeHtml(task.title)}
</h2>

</div>

<div class="reward">
$${Number(task.reward).toFixed(2)}
</div>

</div>

<p>
${escapeHtml(task.description)}
</p>

<div class="meta">

<span>
${Number(task.remaining || 0)} left
</span>

<span>
Verified
</span>

</div>

<button
class="start"
onclick="startTask('${task.id}')">

View Task

</button>

</div>

`).join("");

}


async function loadTasks(){

/*
 We will connect this to the real
 campaigns table after creating it.
*/

tasks=demoTasks;

renderTasks();

}


function startTask(id){

const task =
tasks.find(t=>t.id===id);

if(!task)return;

alert(
"Task selected: " +
task.title +
"\n\nTask details and proof system will be added next."
);

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function goBack(){

window.location.href="dashboard.html";

}


loadTasks();

</script>

</body>
</html>
