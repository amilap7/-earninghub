<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>EarningHub - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#f7f7f7;
color:#111
}

.app{
max-width:600px;
min-height:100vh;
margin:auto;
padding:20px
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0 22px
}

.logo{
font-size:24px;
font-weight:800
}

.logout{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:10px 14px;
font-weight:bold;
cursor:pointer
}

h1{
font-size:29px;
margin-bottom:7px
}

.subtitle{
font-size:14px;
color:#777;
line-height:1.5;
margin-bottom:20px
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.count{
font-size:14px;
font-weight:bold
}

.refresh{
border:1px solid #111;
background:#fff;
border-radius:10px;
padding:9px 12px;
font-weight:bold;
cursor:pointer
}

.message{
display:none;
padding:14px;
border-radius:12px;
background:#eee;
font-size:13px;
line-height:1.5;
margin-bottom:15px
}

.card{
background:#fff;
border:1px solid #ddd;
border-radius:18px;
padding:18px;
margin-bottom:15px
}

.campaign-title{
font-size:19px;
font-weight:bold;
margin-bottom:12px
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
margin-bottom:9px;
font-size:13px
}

.row span:first-child{
color:#777
}

.row strong{
text-align:right;
word-break:break-word
}

.amount{
font-size:27px;
font-weight:800;
margin:14px 0
}

.status{
display:inline-block;
padding:6px 9px;
border-radius:8px;
background:#eee;
font-size:11px;
font-weight:bold;
margin-bottom:15px
}

.receipt{
width:100%;
border:1px solid #ccc;
background:#fff;
padding:12px;
border-radius:11px;
font-weight:bold;
cursor:pointer;
margin-bottom:10px
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}

.approve,
.reject{
border:0;
padding:14px;
border-radius:11px;
font-weight:bold;
cursor:pointer
}

.approve{
background:#111;
color:#fff
}

.reject{
background:#fff;
color:#111;
border:1px solid #111
}

.approve:disabled,
.reject:disabled,
.refresh:disabled{
opacity:.5;
cursor:not-allowed
}

.empty{
text-align:center;
padding:45px 20px;
color:#777;
background:#fff;
border:1px solid #ddd;
border-radius:16px
}

.loading{
text-align:center;
padding:45px 20px;
color:#777
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
z-index:1000;
padding:20px;
align-items:center;
justify-content:center
}

.modal-box{
background:#fff;
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
border-radius:16px;
padding:15px
}

.modal img{
width:100%;
height:auto;
border-radius:10px
}

.close{
width:100%;
border:1px solid #111;
background:#fff;
padding:12px;
border-radius:10px;
font-weight:bold;
margin-top:12px;
cursor:pointer
}

.receipt-link{
display:block;
text-align:center;
padding:13px;
background:#111;
color:#fff;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:10px
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
EarningHub Admin
</div>

<button
class="logout"
id="logoutButton">
Logout
</button>

</header>

<h1>
Payment Review
</h1>

<p class="subtitle">
Review campaign payments and approve or reject submitted receipts.
</p>

<div
id="message"
class="message">
</div>

<div class="topbar">

<div
id="count"
class="count">
Pending: 0
</div>

<button
id="refreshButton"
class="refresh">
Refresh
</button>

</div>

<div
id="loading"
class="loading">
Loading payments...
</div>

<div
id="payments">
</div>

</div>


<div
id="receiptModal"
class="modal">

<div class="modal-box">

<div id="receiptContent">
</div>

<button
id="closeModal"
class="close">
Close
</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zsitqabyplglcppvuetj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NbGpP3kHSfLH9Yqjd_EgDw_mITmJJ_Z";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const RECEIPT_BUCKET =
"campaign-payment-receipts";


let currentUser =
null;


/* =========================
   MESSAGE
========================= */

function showMessage(text){

const box =
document.getElementById("message");

box.textContent =
text;

box.style.display =
"block";

}


function hideMessage(){

const box =
document.getElementById("message");

box.textContent =
"";

box.style.display =
"none";

}


/* =========================
   AUTH CHECK
========================= */

async function checkAdmin(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error){

throw new Error(
error.message
);

}


if(!data.session){

window.location.href =
"login.html";

return false;

}


currentUser =
data.session.user;


/*
The actual admin authorization
is handled by Supabase RLS.
*/

return true;

}


/* =========================
   LOAD PAYMENTS
========================= */

async function loadPayments(){

hideMessage();

const loading =
document.getElementById(
"loading"
);

const container =
document.getElementById(
"payments"
);

loading.style.display =
"block";

container.innerHTML =
"";


try{

const allowed =
await checkAdmin();

if(!allowed){

return;

}


/*
Only payment_review records.
*/

const {
data:payments,
error
} =
await supabaseClient
.from("campaign_payments")
.select(`
id,
campaign_id,
creator_id,
amount,
payment_method,
receipt_url,
status,
created_at
`)
.eq(
"status",
"pending"
)
.order(
"created_at",
{
ascending:false
});


if(error){

throw new Error(
error.message
);

}


loading.style.display =
"none";


if(!payments ||
payments.length === 0){

document.getElementById(
"count"
).textContent =
"Pending: 0";

container.innerHTML = `
<div class="empty">
No pending payment requests.
</div>
`;

return;

}


document.getElementById(
"count"
).textContent =
"Pending: " +
payments.length;


/*
Load campaigns separately.
*/

for(
const payment of payments
){

await renderPayment(
payment,
container
);

}


}catch(error){

loading.style.display =
"none";

showMessage(
"Unable to load payments: " +
error.message
);

}

}


/* =========================
   RENDER PAYMENT
========================= */

async function renderPayment(
payment,
container
){

let campaign = null;

try{

const {
data,
error
} =
await supabaseClient
.from("campaigns")
.select(`
id,
title,
platform,
task_type,
target_url,
budget,
status,
created_at
`)
.eq(
"id",
payment.campaign_id
)
.maybeSingle();


if(error){

console.error(
error
);

}else{

campaign =
data;

}

}catch(error){

console.error(
error
);

}


const card =
document.createElement(
"div"
);

card.className =
"card";


const title =
campaign?.title ||
"Campaign";


const platform =
campaign?.platform ||
"-";


const taskType =
campaign?.task_type ||
"-";


const amount =
Number(
payment.amount || 0
);


const createdAt =
payment.created_at
?
new Date(
payment.created_at
).toLocaleString()
:
"-";


card.innerHTML = `

<div class="campaign-title">
${escapeHtml(title)}
</div>

<div class="status">
PAYMENT REVIEW
</div>

<div class="row">
<span>Payment ID</span>
<strong>${escapeHtml(payment.id)}</strong>
</div>

<div class="row">
<span>Creator ID</span>
<strong>${escapeHtml(payment.creator_id)}</strong>
</div>

<div class="row">
<span>Platform</span>
<strong>${escapeHtml(platform)}</strong>
</div>

<div class="row">
<span>Task type</span>
<strong>${escapeHtml(taskType)}</strong>
</div>

<div class="row">
<span>Payment method</span>
<strong>${escapeHtml(payment.payment_method || "-")}</strong>
</div>

<div class="row">
<span>Submitted</span>
<strong>${escapeHtml(createdAt)}</strong>
</div>

<div class="amount">
$${amount.toFixed(2)}
</div>

<button
class="receipt"
data-receipt="${escapeHtml(payment.receipt_url || "")}">
View Payment Receipt
</button>

<div class="actions">

<button
class="approve"
data-payment="${escapeHtml(payment.id)}"
data-campaign="${escapeHtml(payment.campaign_id)}">

Approve

</button>

<button
class="reject"
data-payment="${escapeHtml(payment.id)}"
data-campaign="${escapeHtml(payment.campaign_id)}">

Reject

</button>

</div>

`;


container.appendChild(
card
);


/*
Receipt button.
*/

card
.querySelector(".receipt")
.addEventListener(
"click",
function(){

openReceipt(
payment.receipt_url
);

});


/*
Approve.
*/

card
.querySelector(".approve")
.addEventListener(
"click",
function(){

approvePayment(
payment.id,
payment.campaign_id,
card
);

});


/*
Reject.
*/

card
.querySelector(".reject")
.addEventListener(
"click",
function(){

rejectPayment(
payment.id,
payment.campaign_id,
card
);

});

}


/* =========================
   RECEIPT
========================= */

async function openReceipt(
path
){

if(!path){

showMessage(
"Receipt file is missing."
);

return;

}


try{

const {
data,
error
} =
await supabaseClient
.rpc(
"admin_get_campaign_receipt",
{
p_path:path
}
);


if(error){

throw new Error(
error.message
);

}


if(!data){

throw new Error(
"Unable to create receipt link."
);

}


const modal =
document.getElementById(
"receiptModal"
);

const content =
document.getElementById(
"receiptContent"
);


/*
PDF
*/

if(
path.toLowerCase()
.endsWith(".pdf")
){

content.innerHTML = `

<a
class="receipt-link"
href="${data}"
target="_blank"
rel="noopener">

Open PDF Receipt

</a>

`;

}else{

content.innerHTML = `

<img
src="${data}"
alt="Payment Receipt">

`;

}


modal.style.display =
"flex";


}catch(error){

showMessage(
"Unable to open receipt: " +
error.message
);

}

}


/* =========================
   APPROVE
========================= */

async function approvePayment(
paymentId,
campaignId,
card
){

const confirmed =
confirm(
"Approve this payment and activate the campaign?"
);


if(!confirmed){

return;

}


const buttons =
card.querySelectorAll(
"button"
);


buttons.forEach(
button =>
button.disabled = true
);


try{

/*
Update payment.
*/

const {
error:paymentError
} =
await supabaseClient
.from("campaign_payments")
.update({

status:
"approved"

})
.eq(
"id",
paymentId
)
.eq(
"status",
"pending"
);


if(paymentError){

throw new Error(
paymentError.message
);

}


/*
Activate campaign.
*/

const {
error:campaignError
} =
await supabaseClient
.from("campaigns")
.update({

status:
"active"

})
.eq(
"id",
campaignId
)
.eq(
"status",
"payment_review"
);


if(campaignError){

throw new Error(
campaignError.message
);

}


showMessage(
"Payment approved. Campaign is now active."
);


card.remove();


updateCount();


}catch(error){

buttons.forEach(
button =>
button.disabled = false
);

showMessage(
"Approval failed: " +
error.message
);

}

}


/* =========================
   REJECT
========================= */

async function rejectPayment(
paymentId,
campaignId,
card
){

const confirmed =
confirm(
"Reject this payment and campaign?"
);


if(!confirmed){

return;

}


const buttons =
card.querySelectorAll(
"button"
);


buttons.forEach(
button =>
button.disabled = true
);


try{

const {
error:paymentError
} =
await supabaseClient
.from("campaign_payments")
.update({

status:
"rejected"

})
.eq(
"id",
paymentId
)
.eq(
"status",
"pending"
);


if(paymentError){

throw new Error(
paymentError.message
);

}


/*
Reject campaign.
*/

const {
error:campaignError
} =
await supabaseClient
.from("campaigns")
.update({

status:
"rejected"

})
.eq(
"id",
campaignId
)
.eq(
"status",
"payment_review"
);


if(campaignError){

throw new Error(
campaignError.message
);

}


showMessage(
"Payment rejected."
);


card.remove();


updateCount();


}catch(error){

buttons.forEach(
button =>
button.disabled = false
);

showMessage(
"Rejection failed: " +
error.message
);

}

}


/* =========================
   COUNT
========================= */

function updateCount(){

const cards =
document.querySelectorAll(
"#payments .card"
);

document.getElementById(
"count"
).textContent =
"Pending: " +
cards.length;


if(cards.length === 0){

document.getElementById(
"payments"
).innerHTML = `

<div class="empty">
No pending payment requests.
</div>

`;

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
value
){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =========================
   CLOSE RECEIPT
========================= */

document
.getElementById(
"closeModal"
)
.addEventListener(
"click",
function(){

document.getElementById(
"receiptModal"
).style.display =
"none";

document.getElementById(
"receiptContent"
).innerHTML =
"";

});


document
.getElementById(
"receiptModal"
)
.addEventListener(
"click",
function(event){

if(
event.target === this
){

this.style.display =
"none";

}

});


/* =========================
   REFRESH
========================= */

document
.getElementById(
"refreshButton"
)
.addEventListener(
"click",
loadPayments
);


/* =========================
   LOGOUT
========================= */

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
async function(){

await supabaseClient.auth.signOut();

window.location.href =
"login.html";

});


/* =========================
   START
========================= */

loadPayments();

</script>

</body>
</html>
